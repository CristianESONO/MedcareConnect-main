<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>MedCare Onboarding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : back-office à deux colonnes — dossiers à gauche, chaîne d'onboarding en cinq étapes à droite. */
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --sunk:#EBEFF1; --line:#DCE3E6; --line2:#E9EEF0;
  --ink:#14202B; --ink2:#566370; --ink3:#8793A0;
  --teal:#0F766E; --teal-ink:#0B5A54; --teal-bg:#E3F2F0;
  --ok:#157A3D; --okbg:#E4F3E8; --cf:#A85407; --cfbg:#FCEFD9; --no:#B42318; --nobg:#FBE9E7; --info:#2346B8; --infobg:#E8EDFB;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1419; --surface:#151D24; --sunk:#111820; --line:#26313B; --line2:#1D2730;
  --ink:#E6ECF1; --ink2:#9AA7B4; --ink3:#6E7B88;
  --teal:#3FC1B1; --teal-ink:#7DD8CC; --teal-bg:#123330;
  --ok:#5FCE8A; --okbg:#143021; --cf:#E3A343; --cfbg:#3A2B12; --no:#FF8E83; --nobg:#3A1A17; --info:#8EA8FF; --infobg:#1A2446;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1419; --surface:#151D24; --sunk:#111820; --line:#26313B; --line2:#1D2730;
  --ink:#E6ECF1; --ink2:#9AA7B4; --ink3:#6E7B88;
  --teal:#3FC1B1; --teal-ink:#7DD8CC; --teal-bg:#123330;
  --ok:#5FCE8A; --okbg:#143021; --cf:#E3A343; --cfbg:#3A2B12; --no:#FF8E83; --nobg:#3A1A17; --info:#8EA8FF; --infobg:#1A2446;
  color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--ink2)}
.small{font-size:12.5px}
h1,h2,h3{margin:0;text-wrap:balance}

/* bandeau */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:-.01em}
.brand span{color:var(--ink2);font-size:13px}
.proto{font-size:12px;color:var(--cf);background:var(--cfbg);border-radius:999px;padding:3px 10px}
.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink2);font-weight:500}
.tab[aria-current="page"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.tab:hover{color:var(--ink)}

.shell{display:grid;grid-template-columns:272px minmax(0,1fr);gap:20px;align-items:start;max-width:1320px;margin:0 auto}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}}

/* dossiers */
.side{display:flex;flex-direction:column;gap:10px;position:sticky;top:12px}
@media (max-width:900px){.side{position:static}}
.side h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.dlist{display:flex;flex-direction:column;gap:6px}
@media (max-width:900px){.dlist{flex-direction:row;overflow-x:auto;padding-bottom:4px}.ditem{min-width:220px}}
.ditem{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.ditem[aria-current="true"]{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.ditem .n{font-weight:600;line-height:1.3}
.ditem .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:none;color:var(--teal);cursor:pointer;padding:0;font-weight:500}

/* pastilles */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--okbg)} .p-cf{color:var(--cf);background:var(--cfbg)} .p-no{color:var(--no);background:var(--nobg)}
.p-info{color:var(--info);background:var(--infobg)} .p-teal{color:var(--teal-ink);background:var(--teal-bg)} .p-neutral{color:var(--ink2);background:var(--sunk)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11.5px;color:var(--ink2);background:var(--sunk);white-space:nowrap}
.chip.warn{color:var(--cf);border-color:color-mix(in srgb,var(--cf) 40%,transparent);background:var(--cfbg)}
.chip.bad{color:var(--no);border-color:color-mix(in srgb,var(--no) 40%,transparent);background:var(--nobg)}

/* entête dossier + étapes */
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.head h1{font-family:var(--f-display);font-weight:500;font-size:26px;letter-spacing:-.01em;line-height:1.15}
.idrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;color:var(--ink2);font-size:13px}
.steps{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow-x:auto;margin-bottom:16px}
.step{flex:1 1 0;min-width:150px;border:none;background:none;text-align:left;padding:10px 14px;cursor:pointer;border-right:1px solid var(--line2);display:flex;gap:10px;align-items:center}
.step:last-child{border-right:none}
.step .k{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line);color:var(--ink2);flex:none}
.step .t{display:flex;flex-direction:column;line-height:1.25}
.step .t b{font-weight:600;font-size:13.5px}
.step .t span{font-size:12px;color:var(--ink2)}
.step.done .k{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.step[aria-current="step"]{background:var(--teal-bg)}
.step[aria-current="step"] .k{border-color:var(--teal);color:var(--teal-ink)}
.step[disabled]{cursor:not-allowed;opacity:.55}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel h2{font-size:15px;font-weight:600;margin-bottom:4px}
.panel p{margin:4px 0 0;max-width:68ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--ink2)} .kv dd{margin:0}

.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;background:var(--sunk);position:relative}
.drop.over{border-color:var(--teal);background:var(--teal-bg)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop b{display:block;font-size:15px}

/* tableaux */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink2);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--sunk);position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.ln{color:var(--ink3);font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12px}
tr.k-section td{background:var(--teal-bg);font-weight:600;color:var(--teal-ink)}
tr.k-vide td,tr.k-titre td,tr.k-entete td{color:var(--ink3)}
tr.done td{background:color-mix(in srgb,var(--okbg) 45%,transparent)}
.raw{font-weight:600}
.ctx{font-size:12px;color:var(--ink2)}
.why{font-size:12px;color:var(--ink2)}
.alias{font-size:12px;color:var(--teal-ink);margin-top:4px}
select.pick{max-width:340px;width:100%;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--surface)}
input.price{width:100px;text-align:right;border:1px solid var(--line);border-radius:7px;padding:4px 7px;background:var(--surface);font-variant-numeric:tabular-nums}
input.txt,select.txt{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--surface);width:100%}
.score{font-variant-numeric:tabular-nums;font-weight:600}

/* synthèse rapprochement */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum .c{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface)}
.sum .c b{font-family:var(--f-display);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.sum .c span{font-size:12.5px;color:var(--ink2)}
.sum .c.ok b{color:var(--ok)} .sum .c.cf b{color:var(--cf)} .sum .c.no b{color:var(--no)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--sunk);margin-top:10px}
.bar i{display:block;height:100%}
.bar .bok{background:var(--ok)} .bar .bcf{background:var(--cf)} .bar .bno{background:var(--no)} .bar .bva{background:var(--teal)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:none;padding:6px 11px;cursor:pointer;color:var(--ink2);font-weight:500;border-right:1px solid var(--line2)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--teal-bg);color:var(--teal-ink)}
.settings{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px}
.settings label{display:flex;gap:6px;align-items:center;color:var(--ink2)}
.settings input{width:64px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:var(--surface);text-align:right}
.callout{border-left:3px solid var(--teal);background:var(--teal-bg);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13.5px}
.callout.warn{border-left-color:var(--cf);background:var(--cfbg)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line2)}
.check:last-child{border-bottom:none}
.check .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;margin-top:1px}
.ic.y{background:var(--okbg);color:var(--ok)} .ic.n{background:var(--nobg);color:var(--no)}
.toast{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13.5px;z-index:20;max-width:min(420px, calc(100vw - 32px))}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
@media (max-width:600px){.form{grid-template-columns:minmax(0,1fr)}}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.phone{max-width:760px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.phone .bar2{background:var(--teal);color:var(--surface);padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){.ditem,.btn,.step{transition:border-color .15s,background .15s}}
</style>

<div class="top">
  <div class="brand"><a href="index.html" style="text-decoration:none;color:inherit;display:flex;align-items:baseline;gap:10px"><b>MedCare</b><span>Onboarding des catalogues</span></a></div>
  <span class="proto">Prototype · données d'exemple · rien n'est envoyé à un serveur</span>
  <nav>
    <a href="index.html" class="tab" style="text-decoration:none;display:inline-flex;align-items:center">⌂ Accueil</a>
    <a href="medcare_chat.html" class="tab" style="text-decoration:none;display:inline-flex;align-items:center">💬 Chatbot WhatsApp</a>
    <button class="tab" id="nav-dossiers" data-act="top" data-v="dossiers">Dossiers</button>
    <button class="tab" id="nav-lexique" data-act="top" data-v="lexique">Lexique et référentiel</button>
    <button class="tab" id="nav-reset" data-act="reset">Réinitialiser la démo</button>
  </nav>
</div>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* MedCare — moteur d'onboarding (prototype). Miroir JS de la spec du paquet Python medcare_matching. */
var ENGINE = (function () {
  'use strict';

  var STOP = new Set(['de','du','des','la','le','les','et','au','aux','en','sur','sous','avec','par','pour','un','une']);

  var PILLARS = {
    bio: {
      id: 'bio', name: 'Biologie médicale',
      abbrev: { ac: 'anticorps', ag: 'antigene', cv: 'charge virale', bu: 'bandelette urinaire', hb: 'hemoglobine', hiv: 'vih', hcv: 'vhc', hbv: 'vhb', atb: 'antibiogramme', sedim: 'sedimentation', us: 'ultrasensible' },
      disc: ['igg','igm','iga','ige','t3','t4','ft3','ft4','recherche','serologie','pcr','urinaire','urine','plasmatique','serique','total','conjugue','libre','direct','indirect','24h','quantitatif','qualitatif'],
      generic: ['bilan','serologie','dosage','examen','analyse']
    },
    img: {
      id: 'img', name: 'Imagerie médicale',
      abbrev: { echo: 'echographie', radio: 'radiographie', rx: 'radiographie', tdm: 'scanner', genoux: 'genou bilateral', epaules: 'epaule bilateral', hanches: 'hanche bilateral', mains: 'main bilateral', pieds: 'pied bilateral' },
      disc: ['echographie','scanner','irm','radiographie','face','profil','bilateral','droit','gauche','injection','doppler','angio','angioscanner','arteriel','arterio','veineux','controle','endovaginal','transcranien'],
      generic: ['echographie','scanner','irm','radiographie','examen','doppler']
    }
  };

  var SECTION_MAP = [
    { re: /echograph/, pillar: 'img', term: 'echographie', types: ['Échographie', 'Écho-doppler'] },
    { re: /doppler/, pillar: 'img', term: 'echographie doppler', types: ['Écho-doppler'] },
    { re: /scanner|tdm|tomodensito/, pillar: 'img', term: 'scanner', types: ['Scanner'] },
    { re: /\birm\b/, pillar: 'img', term: 'irm', types: ['IRM'] },
    { re: /radiograph|\bradio\b/, pillar: 'img', term: 'radiographie', types: ['Radiographie'] },
    { re: /mammograph/, pillar: 'img', term: '', types: ['Radiologie spéciale'] },
    { re: /examens? speciaux|radiologie speciale/, pillar: 'img', term: '', types: ['Radiologie spéciale', 'Scanner'] },
    { re: /hemato|hemostase|coagul|biochim|ionogram|urinaire|vitamine|cardiaque|endocrin|hormon|fertilit|spermio|tumora|immuno|allergo|serolog|virolog|bacterio|parasito|mycolog|moleculaire|pcr|toxico|gaz du sang|cytopath|genetique|biologie|analyses?/, pillar: 'bio', term: '' }
  ];

  function stripAccents(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, ''); }

  function stem(w) {
    if (w.length <= 3) return w;
    if (/ales$/.test(w)) return w.slice(0, -1).replace(/e$/, '');
    if (/ale$/.test(w)) return w.slice(0, -1);
    if (/iennes?$/.test(w)) return w.replace(/iennes?$/, 'ien');
    if (/ees?$/.test(w)) return w.replace(/ees?$/, 'e');
    if (/ines?$/.test(w) && w.length > 5) return w.replace(/s$/, '');
    if (/[^s]s$/.test(w) && w.length > 4) return w.slice(0, -1);
    return w;
  }

  /* Normalisation : forme seulement, jamais le sens. Renvoie la chaîne et les mots significatifs. */
  function normalize(raw, pillarId) {
    var s = stripAccents(raw).toLowerCase().replace(/\b([dl])['\u2019]\s*/g, '').replace(/(\d+)\s*(h|j|min)\b/g, '$1$2');
    s = s.replace(/\b([a-z0-9])\.(?=[a-z0-9]\b)/g, '$1').replace(/\b([a-z0-9])\.(?=\s|$)/g, '$1');
    var composite = /[a-z)]\s*\+\s*[a-z(]/.test(s) || /\bbilan\b/.test(s);
    s = s.replace(/[^a-z0-9+\/\s]/g, ' ').replace(/[+\/]/g, ' + ').replace(/\s+/g, ' ').trim();
    var ab = PILLARS[pillarId] ? PILLARS[pillarId].abbrev : {};
    var words = s.split(' ').filter(Boolean).map(function (w) { return ab[w] || w; }).join(' ').split(' ');
    var full = words.join(' ').replace(/\s*\+\s*/g, ' + ').trim();
    var sig = words.filter(function (w) { return w !== '+' && !STOP.has(w) && w.length > 0; }).map(stem);
    return { full: full, sig: sig, key: sig.slice().sort().join(' '), compact: sig.join(''), composite: composite };
  }

  /* --- similarités --- */
  function jaro(a, b) {
    if (a === b) return 1;
    var la = a.length, lb = b.length; if (!la || !lb) return 0;
    var md = Math.max(0, Math.floor(Math.max(la, lb) / 2) - 1);
    var ma = new Array(la).fill(false), mb = new Array(lb).fill(false), m = 0, t = 0, k = 0, i, j;
    for (i = 0; i < la; i++) {
      var lo = Math.max(0, i - md), hi = Math.min(i + md + 1, lb);
      for (j = lo; j < hi; j++) { if (!mb[j] && a[i] === b[j]) { ma[i] = mb[j] = true; m++; break; } }
    }
    if (!m) return 0;
    for (i = 0; i < la; i++) { if (ma[i]) { while (!mb[k]) k++; if (a[i] !== b[k]) t++; k++; } }
    return (m / la + m / lb + (m - t / 2) / m) / 3;
  }
  function jw(a, b) {
    var j = jaro(a, b), p = 0;
    while (p < 4 && p < a.length && p < b.length && a[p] === b[p]) p++;
    return j + p * 0.1 * (1 - j);
  }
  function trigrams(s) { var g = new Set(), x = '  ' + s + ' '; for (var i = 0; i < x.length - 2; i++) g.add(x.substr(i, 3)); return g; }
  function dice(A, B) { var n = 0; A.forEach(function (x) { if (B.has(x)) n++; }); return (2 * n) / ((A.size + B.size) || 1); }

  /* Dice « souple » pondéré : un mot proche (faute de frappe) compte pour sa similarité ;
     les mots génériques du pilier (échographie, scanner, dosage…) pèsent moins que les mots précis. */
  function weight(w, pillarId) { var P = PILLARS[pillarId]; if (!P) return 1; if (P.generic.indexOf(w) >= 0) return 0.35; if (P.disc.indexOf(w) >= 0) return 0.5; return 1; }
  function softTokens(A, B, pillarId) {
    if (!A.length || !B.length) return { dice: 0, jac: 0 };
    var used = new Array(B.length).fill(false), sum = 0, exact = 0, wa = 0, wb = 0;
    A.forEach(function (a) { wa += weight(a, pillarId); });
    B.forEach(function (b) { wb += weight(b, pillarId); });
    A.forEach(function (a) {
      var best = 0, bi = -1;
      B.forEach(function (b, i) {
        if (used[i]) return;
        var v = a === b ? 1 : (a.length > 3 && b.length > 3 ? jw(a, b) : 0);
        if (v > best) { best = v; bi = i; }
      });
      if (bi >= 0 && best >= 0.88) { used[bi] = true; var w = (weight(a, pillarId) + weight(B[bi], pillarId)) / 2; sum += best * w; if (best === 1) exact += w; }
    });
    return { dice: (2 * sum) / (wa + wb), jac: exact / (wa + wb - exact) };
  }
  function specificCompact(sig, pillarId) {
    var sp = sig.filter(function (w) { return weight(w, pillarId) > 0.4; });
    return (sp.length ? sp : sig).join('');
  }

  var MODALITIES = ['echographie','scanner','irm','radiographie'];
  function hasFuzzy(set, w) { if (set.has(w)) return true; var ok = false; set.forEach(function (x) { if (!ok && x.length > 3 && w.length > 3 && jw(x, w) >= 0.9) ok = true; }); return ok; }
  function discConflicts(A, B, pillarId) {
    var d = PILLARS[pillarId] ? PILLARS[pillarId].disc : [];
    var sa = new Set(A), sb = new Set(B), out = [];
    d.forEach(function (w) {
      if (MODALITIES.indexOf(w) >= 0) return;
      if (hasFuzzy(sa, w) !== hasFuzzy(sb, w)) out.push(w);
    });
    // mots courts ou chiffrés (vitamine A / D, T3 / T4, 25-OH…) : toujours discriminants
    A.concat(B).forEach(function (w) {
      if ((/^[a-z]$/.test(w) || /\d/.test(w)) && (sa.has(w) !== sb.has(w)) && out.indexOf(w) < 0) out.push(w);
    });
    // modalité : conflit seulement si les deux côtés en nomment une, et pas la même
    var ma = MODALITIES.filter(function (m) { return hasFuzzy(sa, m); }), mb = MODALITIES.filter(function (m) { return hasFuzzy(sb, m); });
    if (ma.length && mb.length && ma.join() !== mb.join()) out.push(ma.concat(mb).filter(function (v, i, x) { return x.indexOf(v) === i; }).join('/'));
    return out;
  }

  /* --- index du référentiel --- */
  function buildIndex(actes, aliases) {
    var idx = { actes: actes, byId: {}, entries: [], exact: {} };
    actes.forEach(function (a) {
      idx.byId[a.id] = a;
      var forms = [{ text: a.name, kind: 'nom' }].concat((a.lexique || []).map(function (x) { return { text: x, kind: 'lexique' }; }));
      forms.forEach(function (f) { addEntry(idx, a, f.text, f.kind, 'global', null); });
    });
    (aliases || []).forEach(function (al) {
      var a = idx.byId[al.acteId]; if (!a || al.statut === 'suspendu') return;
      addEntry(idx, a, al.brut, al.statut === 'actif' ? 'alias' : 'alias_candidat', al.scope, al.organisme, al);
    });
    return idx;
  }
  function addEntry(idx, a, text, kind, scope, org, al) {
    var n = normalize(text, a.pillar);
    if (!n.sig.length) return;
    var e = { acte: a, text: text, kind: kind, scope: scope, org: org, n: n, tri: trigrams(n.compact), alias: al || null };
    idx.entries.push(e);
    var k = a.pillar + '|' + n.key;
    (idx.exact[k] = idx.exact[k] || []).push(e);
  }

  /* --- section et contexte --- */
  function sectionInfo(label) {
    var s = stripAccents(label).toLowerCase();
    for (var i = 0; i < SECTION_MAP.length; i++) if (SECTION_MAP[i].re.test(s)) return SECTION_MAP[i];
    return null;
  }
  function contextualize(label, sec) {
    if (!sec || !sec.term) return label;
    var s = stripAccents(label).toLowerCase();
    var head = sec.term.split(' ')[0].slice(0, 6);
    if (s.indexOf(head) >= 0 || /angio|uro|colo|scan|irm|radio|echo|doppler|mammo/.test(s)) return label;
    return sec.term + ' ' + label;
  }

  /* --- rapprochement d'une ligne --- */
  function exactLookup(idx, n, pillars, orgId) {
    for (var p = 0; p < pillars.length; p++) {
      var list = idx.exact[pillars[p] + '|' + n.key] || [];
      var own = list.filter(function (e) { return e.scope === 'structure' && e.org === orgId && e.kind === 'alias'; });
      if (own.length) return { e: own[0], method: 'alias de la structure' };
      var nom = list.filter(function (e) { return e.kind === 'nom'; });
      if (nom.length) return { e: nom[0], method: 'nom exact' };
      var glob = list.filter(function (e) { return (e.kind === 'lexique' || e.kind === 'alias') && e.scope === 'global'; });
      var ids = new Set(glob.map(function (e) { return e.acte.id; }));
      if (glob.length && ids.size === 1) return { e: glob[0], method: glob[0].kind === 'alias' ? 'alias validé' : 'lexique' };
      if (ids.size > 1) return { ambiguous: true };
    }
    return null;
  }

  function scoreEntry(n, e, pillarId) {
    var st = softTokens(n.sig, e.n.sig, pillarId);
    var j = jw(specificCompact(n.sig, pillarId), specificCompact(e.n.sig, pillarId));
    var s = 0.5 * st.dice + 0.3 * j + 0.2 * st.jac;
    var dc = discConflicts(n.sig, e.n.sig, pillarId);
    s -= 0.25 * dc.length;
    var comp = n.composite !== (e.acte.kind === 'bilan' || e.n.composite);
    if (comp) s -= 0.2;
    return { s: Math.max(0, Math.min(1, s)), disc: dc, comp: comp };
  }

  function matchLine(idx, label, ctxLabel, pillars, orgId, types) {
    var tries = [{ text: label, ctx: false }];
    if (ctxLabel && ctxLabel !== label) tries.unshift({ text: ctxLabel, ctx: true });
    for (var t = 0; t < tries.length; t++) {
      var pid = pillars[0];
      var n = normalize(tries[t].text, pid);
      var ex = exactLookup(idx, n, pillars, orgId);
      if (ex && ex.e) return { exact: true, method: ex.method + (tries[t].ctx ? ' (avec la section)' : ''), cands: [{ acte: ex.e.acte, s: 1, disc: [], via: ex.e.text }], usedText: tries[t].text };
    }
    // flou
    var pid0 = pillars[0];
    var n0 = normalize(tries[0].text, pid0);
    var tri = trigrams(n0.compact);
    var pool = idx.entries.filter(function (e) { return pillars.indexOf(e.acte.pillar) >= 0 && (e.scope === 'global' || e.org === orgId) && (!types || types.indexOf(e.acte.type) >= 0); });
    var pre = pool.map(function (e) { return { e: e, d: dice(tri, e.tri) }; }).sort(function (a, b) { return b.d - a.d; }).slice(0, 60);
    var best = {};
    pre.forEach(function (p) {
      var sc = scoreEntry(n0, p.e, p.e.acte.pillar);
      if (p.e.kind === 'alias_candidat') sc.s = Math.min(1, sc.s + 0.03);
      var cur = best[p.e.acte.id];
      if (!cur || sc.s > cur.s) best[p.e.acte.id] = { acte: p.e.acte, s: sc.s, disc: sc.disc, comp: sc.comp, via: p.e.text, kind: p.e.kind };
    });
    var cands = Object.keys(best).map(function (k) { return best[k]; }).sort(function (a, b) { return b.s - a.s; }).slice(0, 3);
    if (types && (!cands[0] || cands[0].s < 0.6)) {
      var wide = matchLine(idx, label, ctxLabel, pillars, orgId, null);
      if (wide.cands[0] && !wide.cands[0].disc.length && (!cands[0] || wide.cands[0].s > cands[0].s + 0.1)) { wide.widened = true; return wide; }
    }
    return { exact: false, method: 'flou', cands: cands, usedText: tries[0].text };
  }

  function classify(m, rule, th) {
    var c1 = m.cands[0], c2 = m.cands[1];
    if (!c1) return 'inconnu';
    if (m.exact) return 'reconnu';
    var margin = c1.s - (c2 ? c2.s : 0);
    if (rule === 'V2' && c1.s >= th.auto && margin >= th.margin && !c1.disc.length && !c1.comp) return 'reconnu';
    if (c1.s >= th.prop) return 'confirmer';
    return 'inconnu';
  }

  function explain(m, issue, th) {
    var c1 = m.cands[0]; if (!c1) return 'aucun candidat';
    if (m.exact) return m.method;
    var parts = ['flou ' + Math.round(c1.s * 100) + ' %'];
    if (m.cands[1]) parts.push('marge ' + Math.round((c1.s - m.cands[1].s) * 100));
    if (c1.disc.length) parts.push('conflit : ' + c1.disc.join(', '));
    if (c1.comp) parts.push('bilan / acte');
    if (issue === 'reconnu') parts.push('équivalence de forme');
    return parts.join(' · ');
  }

  /* --- prix --- */
  function parsePrice(v) {
    if (v == null || String(v).trim() === '') return { value: null, statut: 'manquant' };
    if (typeof v === 'number') return v < 0 ? { value: null, statut: 'anomalie', note: 'négatif' } : { value: Math.round(v), statut: 'renseigne' };
    var s = stripAccents(String(v)).toUpperCase().trim();
    if (/DEVIS|VARIABLE/.test(s)) return { value: null, statut: 'sur_devis' };
    if (/GRATUIT|OFFERT/.test(s)) return { value: 0, statut: 'renseigne', note: 'gratuit, à confirmer' };
    s = s.replace(/F\s*CFA|FCFA|CFA|XOF|FRANCS?|\bF\b|F$/g, '').replace(/[\s ]/g, '');
    if (/^\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g, '');
    s = s.replace(',', '.');
    var x = Number(s);
    if (!isFinite(x) || s === '') return { value: null, statut: 'anomalie', note: 'illisible : ' + v };
    if (x < 0) return { value: null, statut: 'anomalie', note: 'négatif' };
    return { value: Math.round(x), statut: 'renseigne' };
  }
  function isPriceLike(v) {
    if (typeof v === 'number') return true;
    return /^\s*\d[\d\s., ]*\s*(F|FCFA|CFA|XOF)?\s*$/i.test(String(v == null ? '' : v)) && String(v).trim() !== '';
  }
  function isHeaderWord(v) { return /^(prix|tarifs?|montant|cout|co[uû]t|pu|prix unitaire)$/i.test(stripAccents(String(v == null ? '' : v)).trim()); }
  function isLabelHeader(v) { return /^(actes?|examens?|designation|libelle|prestations?|analyses?|nom|intitule)( de l acte)?$/i.test(stripAccents(String(v == null ? '' : v)).toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim()); }

  /* --- lecture et détection de schéma --- */
  function detectSchema(rows) {
    var ncol = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 0);
    var prof = [];
    for (var c = 0; c < ncol; c++) prof.push({ text: 0, price: 0, len: 0, header: 0, labelHeader: 0 });
    rows.forEach(function (r) {
      for (var c = 0; c < ncol; c++) {
        var v = r[c]; if (v == null || String(v).trim() === '') continue;
        if (isHeaderWord(v)) { prof[c].header++; continue; }
        if (isLabelHeader(v)) { prof[c].labelHeader++; continue; }
        if (isPriceLike(v)) prof[c].price++; else { prof[c].text++; prof[c].len += String(v).trim().length; }
      }
    });
    var priceCol = -1, pmax = 0;
    prof.forEach(function (p, c) { var sc = p.price + 3 * p.header; if (sc > pmax) { pmax = sc; priceCol = c; } });
    var labelCol = -1, lmax = 0;
    prof.forEach(function (p, c) { if (c === priceCol) return; var sc = p.text * Math.min(1, (p.len / (p.text || 1)) / 6) + 3 * p.labelHeader; if (sc > lmax) { lmax = sc; labelCol = c; } });
    var delaiCol = -1;
    prof.forEach(function (p, c) {
      if (c === priceCol || c === labelCol) return;
      var n = 0; rows.forEach(function (r) { if (/\b(\d+\s*(h|j|min|jours?|heures?)|rdv|immediat|urgence)\b/i.test(stripAccents(String(r[c] == null ? '' : r[c])))) n++; });
      if (n >= 3 && delaiCol < 0) delaiCol = c;
    });
    var roles = []; for (c = 0; c < ncol; c++) roles.push(c === labelCol ? 'libelle' : c === priceCol ? 'prix' : c === delaiCol ? 'delai' : (prof[c].text ? 'texte' : 'vide'));
    var conf = Math.min(1, (labelCol >= 0 ? 0.5 : 0) + (priceCol >= 0 ? 0.3 : 0) + (prof[priceCol] && prof[priceCol].price > 5 ? 0.2 : 0));
    return { ncol: ncol, roles: roles, profile: prof, confidence: conf };
  }

  function readRows(rows, roles, filePillar) {
    var labelCols = [], priceCol = roles.indexOf('prix'), delaiCol = roles.indexOf('delai');
    roles.forEach(function (r, c) { if (r === 'libelle' || r === 'texte') labelCols.push(c); });
    var out = [], section = null, prevEmpty = true;
    rows.forEach(function (r, i) {
      var cells = labelCols.map(function (c) { return r[c]; }).filter(function (v) { return v != null && String(v).trim() !== '' && !isPriceLike(v); });
      var label = cells.map(function (v) { return String(v).trim(); }).join(' ').replace(/\s+/g, ' ');
      var pv = priceCol >= 0 ? r[priceCol] : null;
      var empty = !label && (pv == null || String(pv).trim() === '');
      if (empty) { out.push({ num: i + 1, kind: 'vide' }); prevEmpty = true; return; }
      if (isLabelHeader(label) && (pv == null || isHeaderWord(pv))) { out.push({ num: i + 1, kind: 'entete', label: label }); prevEmpty = true; section = null; return; }
      var priceEmpty = pv == null || String(pv).trim() === '';
      var sec = label ? sectionInfo(label) : null;
      var isSection = label && ((pv != null && isHeaderWord(pv)) || (priceEmpty && prevEmpty && (sec || (priceCol >= 0 && label === label.toUpperCase())) && label.split(' ').length <= 3));
      if (isSection) {
        section = { label: label, info: sec };
        out.push({ num: i + 1, kind: 'section', label: label, pillar: sec ? sec.pillar : null });
        prevEmpty = false; return;
      }
      var info = section && section.info;
      var pillar = (info && info.pillar) || filePillar || null;
      out.push({
        num: i + 1, kind: 'acte', label: label, section: section ? section.label : '', ctx: contextualize(label, info),
        price: parsePrice(pv), priceRaw: pv == null ? '' : String(pv), delai: delaiCol >= 0 && r[delaiCol] != null ? String(r[delaiCol]) : '',
        pillar: pillar, types: info && info.types ? info.types : null, merged: cells.length > 1
      });
      prevEmpty = false;
    });
    // lignes avant l'en-tête = titre du document
    var hi = -1; out.forEach(function (l, k) { if (hi < 0 && l.kind === 'entete') hi = k; });
    for (var k = 0; k < hi; k++) if (out[k].kind !== 'vide') { out[k] = { num: out[k].num, kind: 'titre', label: out[k].label }; }
    // pilier du fichier = majorité des sections
    var votes = {}; out.forEach(function (l) { if (l.kind === 'section' && l.pillar) votes[l.pillar] = (votes[l.pillar] || 0) + 1; });
    var maj = Object.keys(votes).sort(function (a, b) { return votes[b] - votes[a]; })[0] || null;
    out.forEach(function (l) { if (l.kind === 'acte' && !l.pillar) l.pillar = maj; });
    // prix aberrants : > 4 × médiane de la section
    var bySec = {};
    out.forEach(function (l) { if (l.kind === 'acte' && l.price.value) (bySec[l.section] = bySec[l.section] || []).push(l.price.value); });
    out.forEach(function (l) {
      if (l.kind !== 'acte' || !l.price.value) return;
      var a = (bySec[l.section] || []).slice().sort(function (x, y) { return x - y; });
      var med = a[Math.floor(a.length / 2)];
      if (a.length >= 4 && l.price.value > 4 * med) { l.price.statut = 'anomalie'; l.price.note = 'prix ' + Math.round(l.price.value / med) + ' × la médiane de la section'; }
    });
    return { lines: out, pillar: maj };
  }

  return { PILLARS: PILLARS, normalize: normalize, buildIndex: buildIndex, matchLine: matchLine, classify: classify, explain: explain, detectSchema: detectSchema, readRows: readRows, parsePrice: parsePrice };
})();

      h += '<tr><td class="mono">v' + x.v + '</td><td>' + hhmm(x.at) + '</td><td class="num">' + x.cree + '</td><td class="num">' + x.maj + '</td><td class="num">' + x.same + '</td><td class="num">' + x.absent + '</td><td>' + (x.annule ? '<span class="pill p-neutral">Annulé</span>' : '<span class="pill p-teal">En production</span>') + '</td><td>' + (!x.annule && x === lots[lots.length - 1] ? '<button class="btn sm ghost" data-act="rollback" data-v="' + x.v + '">Annuler ce lot</button>' : '') + '</td></tr>';
    });
    h += '</tbody></table></div></div>';
  }
  if (b.publishable.length) {
    h += '<div class="tw" style="margin-top:16px;max-height:50vh;overflow:auto"><table><thead><tr><th>Ligne</th><th>Libellé de la structure</th><th>Acte MedCare</th><th class="num">Prix</th><th>Origine</th></tr></thead><tbody>';
    b.publishable.forEach(function (x) {
      var dec = d.decisions[x.l.num];
      h += '<tr><td class="ln">' + x.l.num + '</td><td>' + esc(x.l.label) + '</td><td>' + esc(x.a.name) + '</td><td class="num">' + (x.p.statut === 'sur_devis' ? 'sur devis' : fcfa(x.p.value)) + '</td><td class="small muted">' + (dec ? 'validé par l’opérateur' : 'reconnu automatiquement') + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  return h;
}

function vStructure(d) {
  var keys = Object.keys(d.offer);
  var h = '<div class="stack"><p class="small muted">Simulation du tableau de bord de la structure, à sa première connexion.</p><div class="phone"><div class="bar2"><span>MedCare · Espace structure</span><span>' + esc(d.name) + '</span></div><div style="padding:16px" class="stack">';
  if (!d.compteActive) {
    h += '<div class="callout warn"><b>Compte pas encore réclamé.</b> Le lien d’activation a été envoyé au ' + esc(d.phone || 'numéro de la structure') + '. La structure choisit son mot de passe et retrouve son catalogue déjà rempli.</div>' +
      '<div class="row"><button class="btn primary" data-act="claim">Simuler : la structure active son compte</button></div>';
  } else {
    var allConf = keys.length && keys.every(function (k) { return d.offer[k].confirmed; });
    h += allConf ? '<div class="callout"><b>Catalogue confirmé.</b> Vos ' + keys.length + ' actes sont visibles des patients sur MedCare.</div>'
      : '<div><h2 style="font-family:var(--f-display);font-weight:500;font-size:20px">Votre catalogue a été préparé par MedCare</h2><p class="muted">Vérifiez vos tarifs. Ils seront visibles des patients dès que vous les aurez confirmés.</p></div>';
    h += '<div class="tw" style="max-height:52vh;overflow:auto"><table><thead><tr><th>Votre libellé</th><th>Acte MedCare</th><th class="num">Tarif (FCFA)</th><th></th></tr></thead><tbody>';
    keys.forEach(function (k) {
      var o = d.offer[k], a = REFBY[k];
      h += '<tr><td>' + esc(o.libelle) + '</td><td>' + esc(a ? a.name : k) + '</td><td class="num">' + (allConf ? fcfa(o.price) : '<input class="price" id="sp-' + k + '" data-act="sprice" data-k="' + k + '" value="' + (o.price != null ? o.price : '') + '" aria-label="Tarif ' + esc(a ? a.name : k) + '">') + '</td><td>' + (allConf ? '' : '<button class="link small" style="white-space:nowrap" data-act="flag" data-k="' + k + '">Mauvais acte ?</button>') + '</td></tr>';
    });
    h += '</tbody></table></div>';
    if (!allConf) h += '<div class="row"><button class="btn primary" data-act="confirmall">Je confirme mes tarifs</button></div>';
  }
  h += '</div></div></div>';
  return h;
}

/* ---------- rendu : lexique ---------- */
function vLexique() {
  var al = S.aliases;
  var nb = { bio: 0, img: 0 }; REF.forEach(function (a) { nb[a.pillar]++; });
  var lex = REF.reduce(function (n, a) { return n + (a.lexique || []).length; }, 0);
  var h = '<div class="head"><div><h1>Lexique et référentiel</h1><div class="idrow">Référentiel unique en production · ' + nb.bio + ' actes de biologie (référentiel MedCare) · ' + nb.img + ' actes d’imagerie (démonstration) · ' + lex + ' écritures d’amorçage</div></div></div>';
  h += '<div class="sum" style="margin-bottom:16px"><div class="c"><b>' + al.filter(function (a) { return a.scope === 'structure'; }).length + '</b><span>alias propres à une structure</span></div>' +
    '<div class="c cf"><b>' + al.filter(function (a) { return a.scope === 'global' && a.statut === 'candidat'; }).length + '</b><span>candidats globaux</span></div>' +
    '<div class="c ok"><b>' + al.filter(function (a) { return a.scope === 'global' && a.statut === 'actif'; }).length + '</b><span>alias globaux actifs</span></div>' +
    '<div class="c no"><b>' + al.filter(function (a) { return a.statut === 'ambigu'; }).length + '</b><span>conflits à arbitrer</span></div></div>';
  if (!al.length) h += '<div class="panel empty">Aucun alias appris pour l’instant. Valide une ligne « à confirmer » dans un dossier : l’alias apparaît ici.</div>';
  else {
    h += '<div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn sm" data-act="copyjson">Copier les alias (JSON)</button></div><div class="tw"><table><thead><tr><th>Écriture apprise</th><th>Acte</th><th>Portée</th><th>Statut</th><th class="num">Structures</th><th></th></tr></thead><tbody>';
    al.slice().reverse().forEach(function (a) {
      var ac = REFBY[a.acteId];
      var sp = { actif: 'p-ok', candidat: 'p-cf', ambigu: 'p-no', suspendu: 'p-neutral' }[a.statut];
      h += '<tr><td><div class="raw">' + esc(a.brut.toLowerCase()) + '</div><div class="mono muted">' + esc(a.key) + '</div></td><td>' + esc(ac ? ac.name : a.acteId) + '<div class="why">' + PNAME[a.pillar] + '</div></td><td>' + (a.scope === 'structure' ? 'Structure <span class="mono">' + esc(a.organisme) + '</span>' : 'Global') + '</td>' +
        '<td><span class="pill ' + sp + '">' + a.statut + '</span></td><td class="num">' + a.structures.length + '</td><td>' +
        (a.scope === 'global' && (a.statut === 'candidat' || a.statut === 'ambigu') ? '<button class="btn sm" data-act="promote" data-id="' + a.id + '">Promouvoir (référent)</button> ' : '') +
        (a.statut !== 'suspendu' ? '<button class="btn sm ghost" data-act="suspend" data-id="' + a.id + '">Suspendre</button>' : '<button class="btn sm ghost" data-act="resume" data-id="' + a.id + '">Réactiver</button>') + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '<div class="panel" style="margin-top:16px"><h2>Propositions d’actes (hors référentiel)</h2><p class="small muted">Libellés qu’un opérateur a classés hors référentiel. Le référent médical décide de créer l’acte, de le fusionner avec un existant ou de refuser.</p>';
  if (!S.propositions.length) h += '<p class="muted small">Aucune proposition.</p>';
  else {
    h += '<div class="tw" style="margin-top:8px"><table><thead><tr><th>Libellé</th><th>Pilier</th><th>Structure</th><th>Statut</th></tr></thead><tbody>';
    S.propositions.slice().reverse().forEach(function (p) { h += '<tr><td>' + esc(p.libelle) + '</td><td>' + (PNAME[p.pillar] || '—') + '</td><td class="mono">' + esc(p.structure) + '</td><td><span class="pill p-cf">à examiner</span></td></tr>'; });
    h += '</tbody></table></div>';
  }
  h += '</div>';
  return h;
}

/* ---------- rendu global ---------- */
function render() {
  document.getElementById('nav-dossiers').setAttribute('aria-current', S.top === 'dossiers' ? 'page' : 'false');
  document.getElementById('nav-lexique').setAttribute('aria-current', S.top === 'lexique' ? 'page' : 'false');
  renderSide();
  document.getElementById('main').innerHTML = S.top === 'lexique' ? vLexique() : renderDossier(cur());
  bindDrop();
  save();
}

/* ---------- lecture de fichiers ---------- */
function readFile(file) {
  var d = cur();
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var rows, sheet = '';
      if (window.XLSX) {
        var wb = XLSX.read(new Uint8Array(rd.result), { type: 'array', cellDates: false });
        var best = null;
        wb.SheetNames.forEach(function (n) {
          var r = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: true });
          if (!best || r.length > best.rows.length) best = { name: n, rows: r };
        });
        rows = best.rows; sheet = best.name;
      } else {
        var txt = new TextDecoder('utf-8').decode(new Uint8Array(rd.result));
        var sep = (txt.split('\n')[0].match(/;/g) || []).length >= (txt.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
        rows = txt.split(/\r?\n/).map(function (l) { return l.split(sep); });
      }
      rows = rows.map(function (r) { return (r || []).map(function (v) { return v === undefined ? null : v; }); });
      loadRows(d, rows, file.name, sheet);
      d.view = 'lecture'; render(); toast('Fichier lu : ' + d.lines.filter(function (l) { return l.kind === 'acte'; }).length + ' actes détectés.');
    } catch (e) { toast('Lecture impossible : ' + (e && e.message ? e.message : 'format non reconnu') + '. Essaie un .xlsx, .ods ou .csv.'); }
  };
  rd.readAsArrayBuffer(file);
}
function bindDrop() {
  var dz = document.getElementById('drop'), fi = document.getElementById('fileinput');
  if (!dz || !fi) return;
  fi.addEventListener('change', function () { if (fi.files[0]) readFile(fi.files[0]); });
  ['dragenter', 'dragover'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('over'); }); });
  dz.addEventListener('drop', function (e) { if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
}

/* ---------- événements ---------- */
function lineByNum(d, n) { n = Number(n); for (var i = 0; i < d.lines.length; i++) if (d.lines[i].num === n) return d.lines[i]; return null; }
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return;
  var act = t.dataset.act, d = cur();
  if (['pick', 'price', 'th', 'q', 'role', 'search', 'sprice'].indexOf(act) >= 0) return;
  if (act === 'top') { S.top = t.dataset.v; }
  else if (act === 'reset') { try { localStorage.removeItem(KEY); } catch (x) {} S = seed(); rebuild(); toast('Démo réinitialisée.'); }
  else if (act === 'open') { S.cur = t.dataset.id; S.top = 'dossiers'; }
  else if (act === 'newform') { S.showForm = true; S.form = { type: "Laboratoire d'analyses", pil: 'bio' }; }
  else if (act === 'cancelform') { S.showForm = false; }
  else if (act === 'create') {
    var f = S.form || {}; if (!f.name) return;
    S.seq++; var nd = newDossier({ structId: 'MC-STR-' + String(S.seq).padStart(4, '0'), name: f.name, type: f.type || '', pillars: (f.pil || 'bio').split(','), phone: f.phone || '', ninea: f.ninea || '', exemple: false });
    nd.history.push({ at: now(), msg: 'Pré-inscription par MedCare' + (dupCheck(f) ? ' (doublon signalé, création forcée)' : '') });
    S.dossiers.push(nd); S.cur = nd.id; S.showForm = false; S.top = 'dossiers'; toast('Fiche créée : ' + nd.structId + '. Le lien d’onboarding est prêt.');
  }
  else if (act === 'view') { d.view = t.dataset.v; }
  else if (act === 'copy' || act === 'copyjson') {
    var text = act === 'copy' ? t.dataset.text : JSON.stringify(S.aliases.map(function (a) { return { alias: a.brut, forme: a.key, acte_id: a.acteId, acte: (REFBY[a.acteId] || {}).name, pilier: a.pillar, portee: a.scope, structure: a.organisme, statut: a.statut, structures: a.structures }; }), null, 2);
    var done = function () { toast('Copié.'); };
    try { navigator.clipboard.writeText(text).then(done, function () { toast('Copie refusée par le navigateur : sélectionne le texte à la main.'); }); } catch (x) { toast('Copie indisponible ici.'); }
    return;
  }
  else if (act === 'sample') { loadRows(d, JSON.parse(JSON.stringify(SAMPLES[t.dataset.v])), t.dataset.v === 'ods' ? 'ACTES ET TARIFICATIONS (7).ods' : 'tarifs_laboratoire_exemple.xlsx', 'Feuil1'); d.view = 'lecture'; toast('Fichier d’exemple chargé.'); }
  else if (act === 'schemaok') { d.schemaOk = true; d.view = 'rapprochement'; d.filter = 'todo'; d.history.push({ at: now(), msg: 'Lecture du fichier validée, rapprochement lancé' }); }
  else if (act === 'rule') { S.rule = t.dataset.v; }
  else if (act === 'filter') { d.filter = t.dataset.v; }
  else if (act === 'edit') { d.picks[t.dataset.n + '_edit'] = true; }
  else if (act === 'validate') {
    var l = lineByNum(d, t.dataset.n), r = decide(d, l, d.picks[l.num]);
    if (!r) return;
    delete d.picks[l.num + '_edit'];
    if (Array.isArray(r)) { afterAliasChange(); toast(r.indexOf('promu') >= 0 ? 'Validé. Deuxième structure concordante : l’alias devient global actif.' : r.indexOf('conflit') >= 0 ? 'Validé. Conflit avec un alias existant : envoyé au référent.' : 'Validé. Alias ajouté au lexique.'); }
    else toast('Ligne ' + l.num + ' tranchée.');
  }
  else if (act === 'undo') { delete d.decisions[t.dataset.n]; }
  else if (act === 'okprice') { var l2 = lineByNum(d, t.dataset.n), p0 = priceOf(d, l2); d.prices[l2.num] = { value: p0.value, statut: p0.value != null ? 'renseigne' : 'manquant', note: 'confirmé' }; }
  else if (act === 'bulk') {
    var mm = matches(d), n = 0;
    actes(d).forEach(function (l) { if (state(d, l) === 'confirmer' && mm[l.num].cands[0] && mm[l.num].cands[0].s >= 0.85 && !mm[l.num].cands[0].disc.length) { decide(d, l, 'a:' + mm[l.num].cands[0].acte.id); n++; } });
    afterAliasChange(); toast(n + ' propositions validées.');
  }
  else if (act === 'replay') {
    actes(d).forEach(function (l) { var dec = d.decisions[l.num]; if (dec && (dec.issue === 'confirme' || dec.issue === 'corrige')) delete d.decisions[l.num]; });
    MATCH[d.id] = null; var c = counts(d); toast('Analyse rejouée avec le lexique actuel : ' + c.reconnu + ' reconnus automatiquement.');
  }
  else if (act === 'gotodo') { d.view = 'rapprochement'; d.filter = t.dataset.all ? 'all' : 'todo'; }
  else if (act === 'publish') {
    var b = blockers(d), before = JSON.parse(JSON.stringify(d.offer)), diff = { cree: 0, maj: 0, same: 0, absent: 0 }, keys = {};
    var v = d.lots.length + 1;
    b.publishable.forEach(function (x) {
      keys[x.a.id] = 1; var o = d.offer[x.a.id];
      if (!o) diff.cree++; else if (o.price !== x.p.value) diff.maj++; else diff.same++;
      d.offer[x.a.id] = { price: x.p.value, statut: x.p.statut, libelle: x.l.label, lot: v, confirmed: false, origine: 'onboarding' };
    });
    Object.keys(before).forEach(function (k) { if (!keys[k]) diff.absent++; });
    d.lots.push(Object.assign({ v: v, at: now(), before: before, annule: false }, diff));
    d.history.push({ at: now(), msg: 'Lot v' + v + ' publié : ' + diff.cree + ' créés, ' + diff.maj + ' modifiés' + (d.compteActive ? '' : ' · lien d’activation envoyé') });
    d.view = 'structure'; toast('Lot v' + v + ' publié. En attente de la confirmation des tarifs par la structure.');
  }
  else if (act === 'rollback') {
    var lot = d.lots.filter(function (x) { return String(x.v) === t.dataset.v; })[0];
    if (lot) { d.offer = lot.before; lot.annule = true; d.history.push({ at: now(), msg: 'Lot v' + lot.v + ' annulé, état précédent restauré' }); toast('Lot v' + lot.v + ' annulé.'); }
  }
  else if (act === 'claim') { d.compteActive = true; d.compteAt = now(); d.history.push({ at: now(), msg: 'Compte réclamé par la structure via le lien d’onboarding' }); toast('Compte activé : la structure retrouve son catalogue.'); }
  else if (act === 'confirmall') { Object.keys(d.offer).forEach(function (k) { d.offer[k].confirmed = true; }); d.history.push({ at: now(), msg: 'Tarifs confirmés par la structure · catalogue visible des patients' }); toast('Tarifs confirmés. Catalogue visible des patients.'); }
  else if (act === 'flag') {
    var k = t.dataset.k, o = d.offer[k];
    actes(d).forEach(function (l) { var a = finalActe(d, l); if (a && a.id === k) d.decisions[l.num] = { issue: 'a_revoir', at: now() }; });
    S.aliases.forEach(function (a) { if (a.acteId === k && a.organisme === d.structId) a.statut = 'suspendu'; });
    delete d.offer[k]; afterAliasChange();
    d.history.push({ at: now(), msg: 'La structure signale un mauvais rattachement : « ' + (o ? o.libelle : k) + ' » renvoyé en validation' });
    toast('Renvoyé à MedCare pour correction.');
  }
  else if (act === 'promote') { var a1 = S.aliases.filter(function (x) { return x.id === t.dataset.id; })[0]; if (a1) { S.aliases.forEach(function (x) { if (x !== a1 && x.scope === 'global' && x.key === a1.key && x.pillar === a1.pillar && x.statut === 'ambigu') x.statut = 'suspendu'; }); a1.statut = 'actif'; afterAliasChange(); toast('Alias promu en global actif.'); } }
  else if (act === 'suspend' || act === 'resume') { var a2 = S.aliases.filter(function (x) { return x.id === t.dataset.id; })[0]; if (a2) { a2.statut = act === 'suspend' ? 'suspendu' : (a2.scope === 'structure' ? 'actif' : 'candidat'); afterAliasChange(); } }
  else return;
  render();
});
document.addEventListener('change', function (e) {
  var t = e.target, act = t.dataset && t.dataset.act, d = cur(); if (!act) return;
  if (act === 'pick') { d.picks[t.dataset.n] = t.value; render(); var el = document.getElementById('pick-' + t.dataset.n); if (el) el.focus(); }
  else if (act === 'search') {
    var a = REF.filter(function (x) { return x.name === t.value; })[0];
    if (a) { d.picks[t.dataset.n] = 'a:' + a.id; render(); } else toast('Choisis un acte dans la liste proposée.');
  }
  else if (act === 'price') {
    var l = lineByNum(d, t.dataset.n), p = E.parsePrice(t.value);
    d.prices[l.num] = p.statut === 'anomalie' ? p : { value: p.value, statut: p.statut, note: 'saisi' };
    render();
  }
  else if (act === 'th') { var v = Number(t.value); if (isFinite(v)) { S.th[t.dataset.k] = Math.max(0, Math.min(1, v)); render(); } }
  else if (act === 'role') {
    d.schema.roles[Number(t.dataset.c)] = t.value; readLines(d); d.decisions = {}; d.picks = {}; d.prices = {}; render();
  }
  else if (act === 'sprice') { var o = d.offer[t.dataset.k]; if (o) { var pp = E.parsePrice(t.value); o.price = pp.value; o.statut = pp.statut; save(); } }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.f) { S.form = S.form || {}; S.form[t.dataset.f] = t.value; var pos = t.selectionStart; renderSide(); var el = document.getElementById(t.id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} } return; }
  if (t.dataset && t.dataset.act === 'q') { var d = cur(); d.q = t.value; var pos2 = t.selectionStart; render(); var q = document.getElementById('q'); if (q) { q.focus(); try { q.setSelectionRange(pos2, pos2); } catch (x) {} } }
});

render();
})();
</script>
