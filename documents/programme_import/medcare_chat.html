<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>MedCare Assistant d'onboarding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : la conversation de la structure à gauche (format téléphone), le suivi MedCare à droite. */
:root{
  --bg:#EEF2F2; --surface:#FFFFFF; --sunk:#E8EDEE; --line:#D9E1E3; --line2:#E7ECEE;
  --ink:#14202B; --ink2:#566370; --ink3:#8793A0;
  --teal:#0F766E; --teal-ink:#0B5A54; --teal-bg:#E1F1EF; --me:#D6EFEA; --wall:#E4EBEA;
  --ok:#157A3D; --okbg:#E4F3E8; --cf:#A85407; --cfbg:#FCEFD9; --no:#B42318; --nobg:#FBE9E7; --info:#2346B8; --infobg:#E8EDFB;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1317; --surface:#151D23; --sunk:#10171C; --line:#25303A; --line2:#1C252D;
  --ink:#E6ECF1; --ink2:#9AA7B4; --ink3:#6E7B88;
  --teal:#3FC1B1; --teal-ink:#7DD8CC; --teal-bg:#123330; --me:#14403A; --wall:#0F181D;
  --ok:#5FCE8A; --okbg:#143021; --cf:#E3A343; --cfbg:#3A2B12; --no:#FF8E83; --nobg:#3A1A17; --info:#8EA8FF; --infobg:#1A2446;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1317; --surface:#151D23; --sunk:#10171C; --line:#25303A; --line2:#1C252D;
  --ink:#E6ECF1; --ink2:#9AA7B4; --ink3:#6E7B88;
  --teal:#3FC1B1; --teal-ink:#7DD8CC; --teal-bg:#123330; --me:#14403A; --wall:#0F181D;
  --ok:#5FCE8A; --okbg:#143021; --cf:#E3A343; --cfbg:#3A2B12; --no:#FF8E83; --nobg:#3A1A17; --info:#8EA8FF; --infobg:#1A2446;
  color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 32px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px}
h1,h2,h3{margin:0;text-wrap:balance}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;margin-bottom:14px;border-bottom:1px solid var(--line);max-width:1240px;margin-inline:auto}
.brand b{font-family:var(--f-display);font-weight:600;font-size:21px}
.brand span{color:var(--ink2);font-size:13px;margin-left:8px}
.proto{font-size:12px;color:var(--cf);background:var(--cfbg);border-radius:999px;padding:3px 10px}
.top .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.views{display:none;gap:4px;margin:0 auto 12px;max-width:1240px}
.views button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;cursor:pointer;font-weight:600;color:var(--ink2)}
.views button[aria-pressed="true"]{border-color:var(--teal);color:var(--teal-ink);background:var(--teal-bg)}

.shell{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto;align-items:start}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}.views{display:flex}.shell[data-show="chat"] .ops{display:none}.shell[data-show="ops"] .phone{display:none}}

/* téléphone */
.phone{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--wall);display:flex;flex-direction:column;height:min(780px, calc(100vh - 120px));min-height:520px;position:sticky;top:12px}
@media (max-width:900px){.phone{position:static;height:calc(100vh - 150px)}}
.ph-head{background:var(--teal);color:var(--surface);padding:12px 14px;display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--surface) 22%,transparent);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;flex:none}
.ph-head b{display:block;font-size:15px;line-height:1.2}
.ph-head span{font-size:12px;opacity:.85}
.steps{display:flex;gap:3px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.st{flex:1 0 auto;display:flex;flex-direction:column;gap:4px;min-width:58px}
.st i{display:block;height:4px;border-radius:999px;background:var(--line)}
.st span{font-size:10.5px;color:var(--ink3);white-space:nowrap;font-weight:600;letter-spacing:.02em}
.st.done i{background:var(--teal)} .st.done span{color:var(--ink2)}
.st.now i{background:color-mix(in srgb,var(--teal) 55%,var(--line))} .st.now span{color:var(--teal-ink)}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:86%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.45;box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 8%,transparent);overflow-wrap:anywhere}
.m.bot{background:var(--surface);align-self:flex-start;border-top-left-radius:4px}
.m.me{background:var(--me);align-self:flex-end;border-top-right-radius:4px}
.m .t{display:block;text-align:right;font-size:10.5px;color:var(--ink3);margin-top:2px}
.m b{font-weight:600}
.m .card{margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk);font-size:13px}
.m .card .k{color:var(--ink2);font-size:12px}
.m ul{margin:6px 0 0;padding-left:18px}
.m .q{font-size:11.5px;color:var(--teal-ink);font-weight:600;letter-spacing:.03em;text-transform:uppercase;display:block;margin-bottom:2px}
.sys{align-self:center;font-size:11.5px;color:var(--ink2);background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:999px;padding:3px 10px;text-align:center}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:92%}
.quick button{border:1px solid var(--teal);color:var(--teal-ink);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px;text-align:left}
.quick button:hover{background:var(--teal-bg)}
.quick button.alt{border-color:var(--line);color:var(--ink2);font-weight:500}
.typing{align-self:flex-start;background:var(--surface);border-radius:12px;padding:9px 12px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
.bar{display:flex;gap:8px;padding:10px;background:var(--surface);border-top:1px solid var(--line);align-items:center}
.bar input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--sunk)}
.att{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink2);font-size:20px;line-height:1}
.att input{position:absolute;inset:0;opacity:0;cursor:pointer}
.send{width:38px;height:38px;border-radius:50%;border:none;background:var(--teal);color:var(--surface);cursor:pointer;flex:none;font-weight:700}

/* suivi MedCare */
.ops{display:flex;flex-direction:column;gap:14px;min-width:0}
.ops h1{font-family:var(--f-display);font-weight:500;font-size:24px}
.sub{color:var(--ink2);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-size:14.5px;font-weight:600;margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.kv dt{color:var(--ink2)} .kv dd{margin:0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--okbg)} .p-cf{color:var(--cf);background:var(--cfbg)} .p-no{color:var(--no);background:var(--nobg)} .p-info{color:var(--info);background:var(--infobg)} .p-teal{color:var(--teal-ink);background:var(--teal-bg)} .p-neutral{color:var(--ink2);background:var(--sunk)}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:600px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.sum b{display:block;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--ink2)}
.sum .ok b{color:var(--ok)} .sum .cf b{color:var(--cf)} .sum .no b{color:var(--no)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-height:360px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink2);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px 9px;border-bottom:1px solid var(--line);background:var(--sunk);position:sticky;top:0}
td{padding:8px 9px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:none}
.ln{color:var(--ink3);font-family:var(--f-mono);font-size:12px}
.why{font-size:12px;color:var(--ink2)}
.log{display:flex;flex-direction:column;gap:6px;font-size:13px;max-height:220px;overflow-y:auto}
.log div{display:flex;gap:10px}
.log .ln{flex:none}
.callout{border-left:3px solid var(--teal);background:var(--teal-bg);padding:9px 12px;border-radius:0 8px 8px 0;font-size:13px}
.empty{color:var(--ink2);font-size:13px;padding:6px 0}
</style>

<div class="top">
  <div class="brand"><a href="index.html" style="text-decoration:none;color:inherit;display:flex;align-items:baseline;gap:8px"><b>MedCare</b><span>Assistant d'onboarding · scénario D (chatbot)</span></a></div>
  <span class="proto">Prototype · structure d'exemple · rien n'est envoyé à un serveur</span>
  <div class="r">
    <a href="index.html" class="btn sm" style="text-decoration:none">⌂ Accueil</a>
    <a href="medcare_onboarding.html" class="btn sm" style="text-decoration:none">🖥️ Back-office</a>
    <button class="btn sm" id="restart">Recommencer la conversation</button>
  </div>
</div>
<div class="views" role="group" aria-label="Vue">
  <button id="v-chat" aria-pressed="true" data-view="chat">Conversation</button>
  <button id="v-ops" aria-pressed="false" data-view="ops">Côté MedCare</button>
</div>
<div class="shell" id="shell" data-show="chat">
  <section class="phone" aria-label="Conversation avec la structure">
    <div class="ph-head"><span class="av">M</span><div><b>Assistant MedCare</b><span id="ph-status">en ligne · répond en quelques secondes</span></div></div>
    <div class="steps" id="steps"></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <form class="bar" id="bar" autocomplete="off">
      <label class="att" title="Joindre un fichier">+<input type="file" id="file" accept=".xlsx,.xlsm,.xls,.ods,.csv,.txt,image/*" aria-label="Joindre un fichier"></label>
      <input type="text" id="txt" placeholder="Écrire un message" aria-label="Message">
      <button class="send" type="submit" aria-label="Envoyer">›</button>
    </form>
  </section>
  <section class="ops" id="ops" aria-label="Suivi MedCare"></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* MedCare — moteur d'onboarding (prototype). Miroir JS de la spec du paquet Python medcare_matching. */
var ENGINE = (function () {
  'use strict';

  var STOP = new Set(['de','du','des','la','le','les','et','au','aux','en','sur','sous','avec','par','pour','un','une']);

  var PILLARS = {
    bio: {
      id: 'bio', name: 'Biologie médicale',
      abbrev: { ac: 'anticorps', ag: 'antigene', cv: 'charge virale', bu: 'bandelette urinaire', hb: 'hemoglobine', hiv: 'vih', hcv: 'vhc', hbv: 'vhb', atb: 'antibiogramme', sedim: 'sedimentation', us: 'ultrasensible' },
      disc: ['igg','igm','iga','ige','t3','t4','ft3','ft4','recherche','serologie','pcr','urinaire','urine','plasmatique','serique','total','conjugue','libre','direct','indirect','24h','quantitatif','qualitatif'],
      generic: ['bilan','serologie','dosage','examen','analyse']
    },
    img: {
      id: 'img', name: 'Imagerie médicale',
      abbrev: { echo: 'echographie', radio: 'radiographie', rx: 'radiographie', tdm: 'scanner', genoux: 'genou bilateral', epaules: 'epaule bilateral', hanches: 'hanche bilateral', mains: 'main bilateral', pieds: 'pied bilateral' },
      disc: ['echographie','scanner','irm','radiographie','face','profil','bilateral','droit','gauche','injection','doppler','angio','angioscanner','arteriel','arterio','veineux','controle','endovaginal','transcranien'],
      generic: ['echographie','scanner','irm','radiographie','examen','doppler']
    }
  };

  var SECTION_MAP = [
    { re: /echograph/, pillar: 'img', term: 'echographie', types: ['Échographie', 'Écho-doppler'] },
    { re: /doppler/, pillar: 'img', term: 'echographie doppler', types: ['Écho-doppler'] },
    { re: /scanner|tdm|tomodensito/, pillar: 'img', term: 'scanner', types: ['Scanner'] },
    { re: /\birm\b/, pillar: 'img', term: 'irm', types: ['IRM'] },
    { re: /radiograph|\bradio\b/, pillar: 'img', term: 'radiographie', types: ['Radiographie'] },
    { re: /mammograph/, pillar: 'img', term: '', types: ['Radiologie spéciale'] },
    { re: /examens? speciaux|radiologie speciale/, pillar: 'img', term: '', types: ['Radiologie spéciale', 'Scanner'] },
    { re: /hemato|hemostase|coagul|biochim|ionogram|urinaire|vitamine|cardiaque|endocrin|hormon|fertilit|spermio|tumora|immuno|allergo|serolog|virolog|bacterio|parasito|mycolog|moleculaire|pcr|toxico|gaz du sang|cytopath|genetique|biologie|analyses?/, pillar: 'bio', term: '' }
  ];

  function stripAccents(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, ''); }

  function stem(w) {
    if (w.length <= 3) return w;
    if (/ales$/.test(w)) return w.slice(0, -1).replace(/e$/, '');
    if (/ale$/.test(w)) return w.slice(0, -1);
    if (/iennes?$/.test(w)) return w.replace(/iennes?$/, 'ien');
    if (/ees?$/.test(w)) return w.replace(/ees?$/, 'e');
    if (/ines?$/.test(w) && w.length > 5) return w.replace(/s$/, '');
    if (/[^s]s$/.test(w) && w.length > 4) return w.slice(0, -1);
    return w;
  }

  /* Normalisation : forme seulement, jamais le sens. Renvoie la chaîne et les mots significatifs. */
  function normalize(raw, pillarId) {
    var s = stripAccents(raw).toLowerCase().replace(/\b([dl])['\u2019]\s*/g, '').replace(/(\d+)\s*(h|j|min)\b/g, '$1$2');
    s = s.replace(/\b([a-z0-9])\.(?=[a-z0-9]\b)/g, '$1').replace(/\b([a-z0-9])\.(?=\s|$)/g, '$1');
    var composite = /[a-z)]\s*\+\s*[a-z(]/.test(s) || /\bbilan\b/.test(s);
    s = s.replace(/[^a-z0-9+\/\s]/g, ' ').replace(/[+\/]/g, ' + ').replace(/\s+/g, ' ').trim();
    var ab = PILLARS[pillarId] ? PILLARS[pillarId].abbrev : {};
    var words = s.split(' ').filter(Boolean).map(function (w) { return ab[w] || w; }).join(' ').split(' ');
    var full = words.join(' ').replace(/\s*\+\s*/g, ' + ').trim();
    var sig = words.filter(function (w) { return w !== '+' && !STOP.has(w) && w.length > 0; }).map(stem);
    return { full: full, sig: sig, key: sig.slice().sort().join(' '), compact: sig.join(''), composite: composite };
  }

  /* --- similarités --- */
  function jaro(a, b) {
    if (a === b) return 1;
    var la = a.length, lb = b.length; if (!la || !lb) return 0;
    var md = Math.max(0, Math.floor(Math.max(la, lb) / 2) - 1);
    var ma = new Array(la).fill(false), mb = new Array(lb).fill(false), m = 0, t = 0, k = 0, i, j;
    for (i = 0; i < la; i++) {
      var lo = Math.max(0, i - md), hi = Math.min(i + md + 1, lb);
      for (j = lo; j < hi; j++) { if (!mb[j] && a[i] === b[j]) { ma[i] = mb[j] = true; m++; break; } }
    }
    if (!m) return 0;
    for (i = 0; i < la; i++) { if (ma[i]) { while (!mb[k]) k++; if (a[i] !== b[k]) t++; k++; } }
    return (m / la + m / lb + (m - t / 2) / m) / 3;
  }
  function jw(a, b) {
    var j = jaro(a, b), p = 0;
    while (p < 4 && p < a.length && p < b.length && a[p] === b[p]) p++;
    return j + p * 0.1 * (1 - j);
  }
  function trigrams(s) { var g = new Set(), x = '  ' + s + ' '; for (var i = 0; i < x.length - 2; i++) g.add(x.substr(i, 3)); return g; }
  function dice(A, B) { var n = 0; A.forEach(function (x) { if (B.has(x)) n++; }); return (2 * n) / ((A.size + B.size) || 1); }

  /* Dice « souple » pondéré : un mot proche (faute de frappe) compte pour sa similarité ;
     les mots génériques du pilier (échographie, scanner, dosage…) pèsent moins que les mots précis. */
  function weight(w, pillarId) { var P = PILLARS[pillarId]; if (!P) return 1; if (P.generic.indexOf(w) >= 0) return 0.35; if (P.disc.indexOf(w) >= 0) return 0.5; return 1; }
  function softTokens(A, B, pillarId) {
    if (!A.length || !B.length) return { dice: 0, jac: 0 };
    var used = new Array(B.length).fill(false), sum = 0, exact = 0, wa = 0, wb = 0;
    A.forEach(function (a) { wa += weight(a, pillarId); });
    B.forEach(function (b) { wb += weight(b, pillarId); });
    A.forEach(function (a) {
      var best = 0, bi = -1;
      B.forEach(function (b, i) {
        if (used[i]) return;
        var v = a === b ? 1 : (a.length > 3 && b.length > 3 ? jw(a, b) : 0);
        if (v > best) { best = v; bi = i; }
      });
      if (bi >= 0 && best >= 0.88) { used[bi] = true; var w = (weight(a, pillarId) + weight(B[bi], pillarId)) / 2; sum += best * w; if (best === 1) exact += w; }
    });
    return { dice: (2 * sum) / (wa + wb), jac: exact / (wa + wb - exact) };
  }
  function specificCompact(sig, pillarId) {
    var sp = sig.filter(function (w) { return weight(w, pillarId) > 0.4; });
    return (sp.length ? sp : sig).join('');
  }

  var MODALITIES = ['echographie','scanner','irm','radiographie'];
  function hasFuzzy(set, w) { if (set.has(w)) return true; var ok = false; set.forEach(function (x) { if (!ok && x.length > 3 && w.length > 3 && jw(x, w) >= 0.9) ok = true; }); return ok; }
  function discConflicts(A, B, pillarId) {
    var d = PILLARS[pillarId] ? PILLARS[pillarId].disc : [];
    var sa = new Set(A), sb = new Set(B), out = [];
    d.forEach(function (w) {
      if (MODALITIES.indexOf(w) >= 0) return;
      if (hasFuzzy(sa, w) !== hasFuzzy(sb, w)) out.push(w);
    });
    // mots courts ou chiffrés (vitamine A / D, T3 / T4, 25-OH…) : toujours discriminants
    A.concat(B).forEach(function (w) {
      if ((/^[a-z]$/.test(w) || /\d/.test(w)) && (sa.has(w) !== sb.has(w)) && out.indexOf(w) < 0) out.push(w);
    });
    // modalité : conflit seulement si les deux côtés en nomment une, et pas la même
    var ma = MODALITIES.filter(function (m) { return hasFuzzy(sa, m); }), mb = MODALITIES.filter(function (m) { return hasFuzzy(sb, m); });
    if (ma.length && mb.length && ma.join() !== mb.join()) out.push(ma.concat(mb).filter(function (v, i, x) { return x.indexOf(v) === i; }).join('/'));
    return out;
  }

  /* --- index du référentiel --- */
  function buildIndex(actes, aliases) {
    var idx = { actes: actes, byId: {}, entries: [], exact: {} };
    actes.forEach(function (a) {
      idx.byId[a.id] = a;
      var forms = [{ text: a.name, kind: 'nom' }].concat((a.lexique || []).map(function (x) { return { text: x, kind: 'lexique' }; }));
      forms.forEach(function (f) { addEntry(idx, a, f.text, f.kind, 'global', null); });
    });
    (aliases || []).forEach(function (al) {
      var a = idx.byId[al.acteId]; if (!a || al.statut === 'suspendu') return;
      addEntry(idx, a, al.brut, al.statut === 'actif' ? 'alias' : 'alias_candidat', al.scope, al.organisme, al);
    });
    return idx;
  }
  function addEntry(idx, a, text, kind, scope, org, al) {
    var n = normalize(text, a.pillar);
    if (!n.sig.length) return;
    var e = { acte: a, text: text, kind: kind, scope: scope, org: org, n: n, tri: trigrams(n.compact), alias: al || null };
    idx.entries.push(e);
    var k = a.pillar + '|' + n.key;
    (idx.exact[k] = idx.exact[k] || []).push(e);
  }

  /* --- section et contexte --- */
  function sectionInfo(label) {
    var s = stripAccents(label).toLowerCase();
    for (var i = 0; i < SECTION_MAP.length; i++) if (SECTION_MAP[i].re.test(s)) return SECTION_MAP[i];
    return null;
  }
  function contextualize(label, sec) {
    if (!sec || !sec.term) return label;
    var s = stripAccents(label).toLowerCase();
    var head = sec.term.split(' ')[0].slice(0, 6);
    if (s.indexOf(head) >= 0 || /angio|uro|colo|scan|irm|radio|echo|doppler|mammo/.test(s)) return label;
    return sec.term + ' ' + label;
  }

  /* --- rapprochement d'une ligne --- */
  function exactLookup(idx, n, pillars, orgId) {
    for (var p = 0; p < pillars.length; p++) {
      var list = idx.exact[pillars[p] + '|' + n.key] || [];
      var own = list.filter(function (e) { return e.scope === 'structure' && e.org === orgId && e.kind === 'alias'; });
      if (own.length) return { e: own[0], method: 'alias de la structure' };
      var nom = list.filter(function (e) { return e.kind === 'nom'; });
      if (nom.length) return { e: nom[0], method: 'nom exact' };
      var glob = list.filter(function (e) { return (e.kind === 'lexique' || e.kind === 'alias') && e.scope === 'global'; });
      var ids = new Set(glob.map(function (e) { return e.acte.id; }));
      if (glob.length && ids.size === 1) return { e: glob[0], method: glob[0].kind === 'alias' ? 'alias validé' : 'lexique' };
      if (ids.size > 1) return { ambiguous: true };
    }
    return null;
  }

  function scoreEntry(n, e, pillarId) {
    var st = softTokens(n.sig, e.n.sig, pillarId);
    var j = jw(specificCompact(n.sig, pillarId), specificCompact(e.n.sig, pillarId));
    var s = 0.5 * st.dice + 0.3 * j + 0.2 * st.jac;
    var dc = discConflicts(n.sig, e.n.sig, pillarId);
    s -= 0.25 * dc.length;
    var comp = n.composite !== (e.acte.kind === 'bilan' || e.n.composite);
    if (comp) s -= 0.2;
    return { s: Math.max(0, Math.min(1, s)), disc: dc, comp: comp };
  }

  function matchLine(idx, label, ctxLabel, pillars, orgId, types) {
    var tries = [{ text: label, ctx: false }];
    if (ctxLabel && ctxLabel !== label) tries.unshift({ text: ctxLabel, ctx: true });
    for (var t = 0; t < tries.length; t++) {
      var pid = pillars[0];
      var n = normalize(tries[t].text, pid);
      var ex = exactLookup(idx, n, pillars, orgId);
      if (ex && ex.e) return { exact: true, method: ex.method + (tries[t].ctx ? ' (avec la section)' : ''), cands: [{ acte: ex.e.acte, s: 1, disc: [], via: ex.e.text }], usedText: tries[t].text };
    }
    // flou
    var pid0 = pillars[0];
    var n0 = normalize(tries[0].text, pid0);
    var tri = trigrams(n0.compact);
    var pool = idx.entries.filter(function (e) { return pillars.indexOf(e.acte.pillar) >= 0 && (e.scope === 'global' || e.org === orgId) && (!types || types.indexOf(e.acte.type) >= 0); });
    var pre = pool.map(function (e) { return { e: e, d: dice(tri, e.tri) }; }).sort(function (a, b) { return b.d - a.d; }).slice(0, 60);
    var best = {};
    pre.forEach(function (p) {
      var sc = scoreEntry(n0, p.e, p.e.acte.pillar);
      if (p.e.kind === 'alias_candidat') sc.s = Math.min(1, sc.s + 0.03);
      var cur = best[p.e.acte.id];
      if (!cur || sc.s > cur.s) best[p.e.acte.id] = { acte: p.e.acte, s: sc.s, disc: sc.disc, comp: sc.comp, via: p.e.text, kind: p.e.kind };
    });
    var cands = Object.keys(best).map(function (k) { return best[k]; }).sort(function (a, b) { return b.s - a.s; }).slice(0, 3);
    if (types && (!cands[0] || cands[0].s < 0.6)) {
      var wide = matchLine(idx, label, ctxLabel, pillars, orgId, null);
      if (wide.cands[0] && !wide.cands[0].disc.length && (!cands[0] || wide.cands[0].s > cands[0].s + 0.1)) { wide.widened = true; return wide; }
    }
    return { exact: false, method: 'flou', cands: cands, usedText: tries[0].text };
  }

  function classify(m, rule, th) {
    var c1 = m.cands[0], c2 = m.cands[1];
    if (!c1) return 'inconnu';
    if (m.exact) return 'reconnu';
    var margin = c1.s - (c2 ? c2.s : 0);
    if (rule === 'V2' && c1.s >= th.auto && margin >= th.margin && !c1.disc.length && !c1.comp) return 'reconnu';
    if (c1.s >= th.prop) return 'confirmer';
    return 'inconnu';
  }

  function explain(m, issue, th) {
    var c1 = m.cands[0]; if (!c1) return 'aucun candidat';
    if (m.exact) return m.method;
    var parts = ['flou ' + Math.round(c1.s * 100) + ' %'];
    if (m.cands[1]) parts.push('marge ' + Math.round((c1.s - m.cands[1].s) * 100));
    if (c1.disc.length) parts.push('conflit : ' + c1.disc.join(', '));
    if (c1.comp) parts.push('bilan / acte');
    if (issue === 'reconnu') parts.push('équivalence de forme');
    return parts.join(' · ');
  }

  /* --- prix --- */
  function parsePrice(v) {
    if (v == null || String(v).trim() === '') return { value: null, statut: 'manquant' };
    if (typeof v === 'number') return v < 0 ? { value: null, statut: 'anomalie', note: 'négatif' } : { value: Math.round(v), statut: 'renseigne' };
    var s = stripAccents(String(v)).toUpperCase().trim();
    if (/DEVIS|VARIABLE/.test(s)) return { value: null, statut: 'sur_devis' };
    if (/GRATUIT|OFFERT/.test(s)) return { value: 0, statut: 'renseigne', note: 'gratuit, à confirmer' };
    s = s.replace(/F\s*CFA|FCFA|CFA|XOF|FRANCS?|\bF\b|F$/g, '').replace(/[\s ]/g, '');
    if (/^\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g, '');
    s = s.replace(',', '.');
    var x = Number(s);
    if (!isFinite(x) || s === '') return { value: null, statut: 'anomalie', note: 'illisible : ' + v };
    if (x < 0) return { value: null, statut: 'anomalie', note: 'négatif' };
    return { value: Math.round(x), statut: 'renseigne' };
  }
  function isPriceLike(v) {
    if (typeof v === 'number') return true;
    return /^\s*\d[\d\s., ]*\s*(F|FCFA|CFA|XOF)?\s*$/i.test(String(v == null ? '' : v)) && String(v).trim() !== '';
  }
  function isHeaderWord(v) { return /^(prix|tarifs?|montant|cout|co[uû]t|pu|prix unitaire)$/i.test(stripAccents(String(v == null ? '' : v)).trim()); }
  function isLabelHeader(v) { return /^(actes?|examens?|designation|libelle|prestations?|analyses?|nom|intitule)( de l acte)?$/i.test(stripAccents(String(v == null ? '' : v)).toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim()); }

  /* --- lecture et détection de schéma --- */
  function detectSchema(rows) {
    var ncol = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 0);
    var prof = [];
    for (var c = 0; c < ncol; c++) prof.push({ text: 0, price: 0, len: 0, header: 0, labelHeader: 0 });
    rows.forEach(function (r) {
      for (var c = 0; c < ncol; c++) {
        var v = r[c]; if (v == null || String(v).trim() === '') continue;
        if (isHeaderWord(v)) { prof[c].header++; continue; }
        if (isLabelHeader(v)) { prof[c].labelHeader++; continue; }
        if (isPriceLike(v)) prof[c].price++; else { prof[c].text++; prof[c].len += String(v).trim().length; }
      }
    });
    var priceCol = -1, pmax = 0;
    prof.forEach(function (p, c) { var sc = p.price + 3 * p.header; if (sc > pmax) { pmax = sc; priceCol = c; } });
    var labelCol = -1, lmax = 0;
    prof.forEach(function (p, c) { if (c === priceCol) return; var sc = p.text * Math.min(1, (p.len / (p.text || 1)) / 6) + 3 * p.labelHeader; if (sc > lmax) { lmax = sc; labelCol = c; } });
    var delaiCol = -1;
    prof.forEach(function (p, c) {
      if (c === priceCol || c === labelCol) return;
      var n = 0; rows.forEach(function (r) { if (/\b(\d+\s*(h|j|min|jours?|heures?)|rdv|immediat|urgence)\b/i.test(stripAccents(String(r[c] == null ? '' : r[c])))) n++; });
      if (n >= 3 && delaiCol < 0) delaiCol = c;
    });
    var roles = []; for (c = 0; c < ncol; c++) roles.push(c === labelCol ? 'libelle' : c === priceCol ? 'prix' : c === delaiCol ? 'delai' : (prof[c].text ? 'texte' : 'vide'));
    var conf = Math.min(1, (labelCol >= 0 ? 0.5 : 0) + (priceCol >= 0 ? 0.3 : 0) + (prof[priceCol] && prof[priceCol].price > 5 ? 0.2 : 0));
    return { ncol: ncol, roles: roles, profile: prof, confidence: conf };
  }

  function readRows(rows, roles, filePillar) {
    var labelCols = [], priceCol = roles.indexOf('prix'), delaiCol = roles.indexOf('delai');
    roles.forEach(function (r, c) { if (r === 'libelle' || r === 'texte') labelCols.push(c); });
    var out = [], section = null, prevEmpty = true;
    rows.forEach(function (r, i) {
      var cells = labelCols.map(function (c) { return r[c]; }).filter(function (v) { return v != null && String(v).trim() !== '' && !isPriceLike(v); });
      var label = cells.map(function (v) { return String(v).trim(); }).join(' ').replace(/\s+/g, ' ');
      var pv = priceCol >= 0 ? r[priceCol] : null;
      var empty = !label && (pv == null || String(pv).trim() === '');
      if (empty) { out.push({ num: i + 1, kind: 'vide' }); prevEmpty = true; return; }
      if (isLabelHeader(label) && (pv == null || isHeaderWord(pv))) { out.push({ num: i + 1, kind: 'entete', label: label }); prevEmpty = true; section = null; return; }
      var priceEmpty = pv == null || String(pv).trim() === '';
      var sec = label ? sectionInfo(label) : null;
      var isSection = label && ((pv != null && isHeaderWord(pv)) || (priceEmpty && prevEmpty && (sec || (priceCol >= 0 && label === label.toUpperCase())) && label.split(' ').length <= 3));
      if (isSection) {
        section = { label: label, info: sec };
        out.push({ num: i + 1, kind: 'section', label: label, pillar: sec ? sec.pillar : null });
        prevEmpty = false; return;
      }
      var info = section && section.info;
      var pillar = (info && info.pillar) || filePillar || null;
      out.push({
        num: i + 1, kind: 'acte', label: label, section: section ? section.label : '', ctx: contextualize(label, info),
        price: parsePrice(pv), priceRaw: pv == null ? '' : String(pv), delai: delaiCol >= 0 && r[delaiCol] != null ? String(r[delaiCol]) : '',
        pillar: pillar, types: info && info.types ? info.types : null, merged: cells.length > 1
      });
      prevEmpty = false;
    });
    // lignes avant l'en-tête = titre du document
    var hi = -1; out.forEach(function (l, k) { if (hi < 0 && l.kind === 'entete') hi = k; });
    for (var k = 0; k < hi; k++) if (out[k].kind !== 'vide') { out[k] = { num: out[k].num, kind: 'titre', label: out[k].label }; }
    // pilier du fichier = majorité des sections
    var votes = {}; out.forEach(function (l) { if (l.kind === 'section' && l.pillar) votes[l.pillar] = (votes[l.pillar] || 0) + 1; });
    var maj = Object.keys(votes).sort(function (a, b) { return votes[b] - votes[a]; })[0] || null;
    out.forEach(function (l) { if (l.kind === 'acte' && !l.pillar) l.pillar = maj; });
    // prix aberrants : > 4 × médiane de la section
    var bySec = {};
    out.forEach(function (l) { if (l.kind === 'acte' && l.price.value) (bySec[l.section] = bySec[l.section] || []).push(l.price.value); });
    out.forEach(function (l) {
      if (l.kind !== 'acte' || !l.price.value) return;
      var a = (bySec[l.section] || []).slice().sort(function (x, y) { return x - y; });
      var med = a[Math.floor(a.length / 2)];
      if (a.length >= 4 && l.price.value > 4 * med) { l.price.statut = 'anomalie'; l.price.note = 'prix ' + Math.round(l.price.value / med) + ' × la médiane de la section'; }
    });
    return { lines: out, pillar: maj };
  }

  return { PILLARS: PILLARS, normalize: normalize, buildIndex: buildIndex, matchLine: matchLine, classify: classify, explain: explain, detectSchema: detectSchema, readRows: readRows, parsePrice: parsePrice };
})();

var STATUS = { pre_inscrite: ['Pré-inscrite', 'p-neutral'], fichier_recu: ['Fichier reçu', 'p-info'], en_validation: ['En validation', 'p-cf'], pret_a_publier: ['Prêt à publier', 'p-teal'], publie: ['Publié', 'p-teal'], actif: ['Actif', 'p-ok'] };
var STRUCTS = {
  img: { id: 'MC-STR-0041', name: "Centre d'imagerie (exemple)", pillar: 'img', sample: 'ods', fname: 'ACTES ET TARIFICATIONS (7).ods', phone: '+221 77 000 00 41' },
  bio: { id: 'MC-STR-0042', name: 'Laboratoire exemple (fictif)', pillar: 'bio', sample: 'bio', fname: 'tarifs_laboratoire.xlsx', phone: '+221 77 000 00 42' }
};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fcfa(v) { return v == null ? '—' : Number(v).toLocaleString('fr-FR') + ' F'; }
function clock() { return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var S, IDX = E.buildIndex(REF, []);
function fresh(kind) {
  var st = STRUCTS[kind || 'img'];
  return { st: st, step: 'id', status: 'pre_inscrite', compte: false, msgs: [], quick: null, waiting: null, lines: [], m: {}, issues: {},
    questions: [], qi: 0, answers: {}, prices: {}, left: [], confirmed: false, published: false, aliases: [], log: [], busy: false };
}
function log(msg) { S.log.unshift({ at: clock(), msg: msg }); }

/* ---------- messages ---------- */
var queue = [], playing = false;
function bot(html, quick, opts) { queue.push({ kind: 'bot', html: html, quick: quick || null, opts: opts || {} }); play(); }
function sys(text) { queue.push({ kind: 'sys', html: esc(text) }); play(); }
function me(text) { S.msgs.push({ from: 'me', html: esc(text), at: clock() }); S.quick = null; render(); }
function play() {
  if (playing) return; var x = queue.shift(); if (!x) { render(); return; }
  playing = true;
  if (x.kind === 'sys') { S.msgs.push({ from: 'sys', html: x.html }); playing = false; render(); play(); return; }
  S.typing = true; render();
  setTimeout(function () {
    S.typing = false; S.msgs.push({ from: 'bot', html: x.html, at: clock() });
    if (x.quick) S.quick = x.quick;
    if (x.opts.then) x.opts.then();
    playing = false; render(); play();
  }, REDUCED ? 60 : Math.min(900, 280 + x.html.length * 2));
}

/* ---------- flux ---------- */
function start(kind) {
  S = fresh(kind); queue = []; playing = false;
  sys('Lien d’onboarding ouvert · jeton valide, rattaché à ' + S.st.id);
  log('Lien d’onboarding ouvert par la structure');
  bot('Bonjour, je suis l’assistant MedCare. Je vais vous aider à mettre votre catalogue en ligne, <b>sans rien ressaisir</b> : vous m’envoyez votre fichier de tarifs tel qu’il est, je le lis, et je ne vous pose que les questions utiles.');
  bot('Ce lien est rattaché à <b>' + esc(S.st.name) + '</b> (identifiant ' + esc(S.st.id) + '). C’est bien votre structure ?', [
    { l: 'Oui, c’est nous', a: function () { me('Oui, c’est nous'); askFile(); } },
    { l: 'Non', alt: true, a: function () { me('Non'); bot('D’accord. Je préviens l’équipe MedCare, un conseiller vous rappelle pour corriger le rattachement. Dans cette démo, on continue avec la structure d’exemple.'); log('La structure conteste le rattachement du lien : rappel conseiller à prévoir'); askFile(); } },
    { l: 'Essayer avec un laboratoire (biologie)', alt: true, a: function () { me('Essayer avec un laboratoire'); start('bio'); } }
  ]);
  render();
}
function askFile() {
  S.step = 'fichier';
  bot('Envoyez-moi votre <b>fichier de tarifs</b> : Excel, LibreOffice ou CSV, comme vous l’avez. Utilisez le bouton <b>+</b> en bas à gauche.', [
    { l: 'Envoyer le fichier d’exemple', a: function () { me('📎 ' + S.st.fname); ingest(JSON.parse(JSON.stringify(SAMPLES[S.st.sample])), S.st.fname); } },
    { l: 'Je n’ai pas de fichier', alt: true, a: function () { me('Je n’ai pas de fichier'); bot('Pas de souci. Je vous envoie le <b>gabarit MedCare</b> de votre pilier : la liste des examens est déjà remplie, il ne reste que vos prix à mettre. (Scénario B, hors de cette démo.)', [{ l: 'Finalement, envoyer le fichier d’exemple', a: function () { me('📎 ' + S.st.fname); ingest(JSON.parse(JSON.stringify(SAMPLES[S.st.sample])), S.st.fname); } }]); } }
  ]);
}
function ingest(rows, name) {
  S.step = 'lecture'; S.status = 'fichier_recu'; log('Fichier reçu par le chat : ' + name);
  var sch = E.detectSchema(rows);
  var r = E.readRows(rows, sch.roles, S.st.pillar);
  S.lines = r.lines.filter(function (l) { return l.kind === 'acte'; });
  if (!S.lines.length) { bot('Je n’arrive pas à trouver d’examens dans ce fichier. Pouvez-vous m’envoyer le fichier Excel d’origine plutôt qu’un export ?', [{ l: 'Envoyer le fichier d’exemple', a: function () { me('📎 ' + S.st.fname); ingest(JSON.parse(JSON.stringify(SAMPLES[S.st.sample])), S.st.fname); } }]); return; }
  var secs = {}; S.lines.forEach(function (l) { var k = l.section || 'Sans rubrique'; secs[k] = (secs[k] || 0) + 1; });
  S.lines.forEach(function (l) {
    S.m[l.num] = E.matchLine(IDX, l.label, l.ctx, [l.pillar || S.st.pillar], S.st.id, l.types);
    S.issues[l.num] = E.classify(S.m[l.num], 'V1', TH);
  });
  log('Lecture : ' + S.lines.length + ' examens, ' + Object.keys(secs).length + ' rubriques');
  var list = Object.keys(secs).map(function (k) { return '<li>' + esc(cap(k)) + ' : ' + secs[k] + '</li>'; }).join('');
  bot('Fichier bien reçu. J’ai lu <b>' + S.lines.length + ' examens</b> répartis ainsi :<ul>' + list + '</ul>', null);
  bot('C’est bien tout votre catalogue ?', [
    { l: 'Oui, c’est complet', a: function () { me('Oui, c’est complet'); afterRead(); } },
    { l: 'Il manque des examens', alt: true, a: function () { me('Il manque des examens'); bot('Envoyez-moi l’autre fichier ou l’autre feuille avec le bouton +, je l’ajouterai. Pour la démo, on continue avec celui-ci.'); log('La structure signale un catalogue incomplet'); afterRead(); } }
  ]);
}
function cap(s) { s = String(s).toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }
function afterRead() {
  S.step = 'questions'; S.status = 'en_validation';
  var ok = S.lines.filter(function (l) { return S.issues[l.num] === 'reconnu'; });
  // questions : sens d'abord, puis prix
  var qs = [];
  S.lines.forEach(function (l) { if (S.issues[l.num] !== 'reconnu') qs.push({ type: 'sens', l: l }); });
  S.lines.forEach(function (l) { if (l.price.statut === 'manquant' || l.price.statut === 'anomalie') qs.push({ type: 'prix', l: l }); });
  S.questions = qs; S.qi = 0;
  bot('J’ai reconnu <b>' + ok.length + ' examens sur ' + S.lines.length + '</b> sans rien vous demander.' + (qs.length ? ' Il me reste <b>' + qs.length + ' questions</b> courtes, une à la fois. Vous pouvez vous arrêter quand vous voulez : l’équipe MedCare terminera.' : ''));
  if (qs.length) bot('On y va ?', [{ l: 'Oui, allons-y', a: function () { me('Oui, allons-y'); ask(); } }, { l: 'Laisser MedCare s’en charger', alt: true, a: function () { me('Laissez MedCare s’en charger'); skipRest(); } }]);
  else toTarifs();
}
function ask() {
  if (S.qi >= S.questions.length) { toTarifs(); return; }
  if (S.qi > 0 && S.qi % 6 === 0 && !S.questions[S.qi].pausedAsk) {
    S.questions[S.qi].pausedAsk = true;
    bot('Merci, ça avance bien. Il reste <b>' + (S.questions.length - S.qi) + ' questions</b>. On continue ?', [{ l: 'Continuer', a: function () { me('Continuer'); ask(); } }, { l: 'MedCare finira', alt: true, a: function () { me('MedCare finira'); skipRest(); } }]);
    return;
  }
  var q = S.questions[S.qi], l = q.l, n = S.qi + 1, tot = S.questions.length;
  var head = '<span class="q">Question ' + n + ' sur ' + tot + '</span>';
  if (q.type === 'sens') {
    var m = S.m[l.num], cands = m.cands.filter(function (c) { return c.s >= 0.35; }).slice(0, 3);
    var src = '« ' + esc(l.label) + ' »' + (l.section && l.ctx !== l.label ? ' (rubrique ' + esc(cap(l.section)) + ')' : '');
    var quick = cands.map(function (c) { return { l: c.acte.name, a: function () { me(c.acte.name); answerSens(q, c.acte.id, null); } }; });
    quick.push({ l: 'Aucun de ceux-là', alt: true, a: function () { me('Aucun de ceux-là'); S.waiting = { kind: 'precise', q: q }; bot('Décrivez-moi l’examen en quelques mots, je transmets à l’équipe MedCare.', [{ l: 'Passer', alt: true, a: function () { me('Passer'); S.waiting = null; answerSens(q, null, null, true); } }]); } });
    quick.push({ l: 'Passer', alt: true, a: function () { me('Passer'); answerSens(q, null, null, true); } });
    bot(head + 'Dans votre fichier : ' + src + '. ' + (cands.length ? 'Voulez-vous dire :' : 'Je ne le trouve pas dans notre liste. De quel examen s’agit-il ?'), quick);
  } else {
    var p = S.prices[l.num] || l.price;
    if (p.statut === 'manquant') {
      S.waiting = { kind: 'prix', q: q };
      bot(head + '« ' + esc(l.label) + ' » n’a pas de tarif dans votre fichier. Quel est votre prix ? Écrivez le montant en francs.', [
        { l: 'Sur devis', alt: true, a: function () { me('Sur devis'); setPrice(q, { value: null, statut: 'sur_devis' }); } },
        { l: 'Nous ne le faisons plus', alt: true, a: function () { me('Nous ne le faisons plus'); S.answers[l.num] = { ignore: true }; S.waiting = null; log('Ligne ' + l.num + ' retirée par la structure (« ne le fait plus »)'); next(); } }
      ]);
    } else {
      var guess = p.value && p.value >= 100000 ? Math.round(p.value / 10) : null;
      var quick2 = [{ l: 'Oui, ' + fcfa(p.value), a: function () { me('Oui, ' + fcfa(p.value)); setPrice(q, { value: p.value, statut: 'renseigne' }); } }];
      if (guess) quick2.push({ l: 'Non, ' + fcfa(guess), a: function () { me('Non, ' + fcfa(guess)); setPrice(q, { value: guess, statut: 'renseigne' }); } });
      quick2.push({ l: 'Autre montant', alt: true, a: function () { me('Autre montant'); S.waiting = { kind: 'prix', q: q }; bot('Écrivez le bon montant en francs.'); } });
      bot(head + '« ' + esc(l.label) + ' » est à <b>' + fcfa(p.value) + '</b>, nettement au-dessus de vos autres examens de la rubrique. C’est bien le bon tarif ?', quick2);
    }
  }
}
function answerSens(q, acteId, text, skipped) {
  var l = q.l;
  if (skipped) { S.left.push(l.num); log('Question passée : « ' + l.label + ' » laissée à MedCare'); }
  else { S.answers[l.num] = { acteId: acteId, text: text }; log('Réponse de la structure : « ' + l.label + ' » → ' + (acteId ? REFBY[acteId].name : 'précision « ' + text + ' »') + ' · à valider'); }
  next();
}
function setPrice(q, p) { S.prices[q.l.num] = p; S.waiting = null; log('Prix confirmé par la structure : « ' + q.l.label + ' » → ' + (p.statut === 'sur_devis' ? 'sur devis' : fcfa(p.value))); next(); }
function next() { S.qi++; ask(); }
function skipRest() {
  for (var i = S.qi; i < S.questions.length; i++) if (S.questions[i].type === 'sens') S.left.push(S.questions[i].l.num);
  log((S.questions.length - S.qi) + ' questions laissées à l’équipe MedCare');
  S.qi = S.questions.length;
  bot('Entendu, l’équipe MedCare s’occupe des points restants.');
  toTarifs();
}
function finalLines() {
  return S.lines.filter(function (l) { return !(S.answers[l.num] && S.answers[l.num].ignore); });
}
function toTarifs() {
  S.step = 'tarifs';
  var L = finalLines(), vals = L.map(function (l) { var p = S.prices[l.num] || l.price; return p.value; }).filter(function (v) { return v != null; });
  var miss = L.filter(function (l) { var p = S.prices[l.num] || l.price; return p.statut === 'manquant'; }).length;
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var pend = Object.keys(S.answers).filter(function (k) { return S.answers[k].acteId || S.answers[k].text; }).length + S.left.length;
  bot('Voici votre catalogue prêt :<div class="card"><div><b>' + L.length + ' examens</b>, de ' + fcfa(min) + ' à ' + fcfa(max) + '</div>' +
    (miss ? '<div class="k">' + miss + ' tarif(s) encore manquant(s), non publiés tant qu’ils sont vides</div>' : '') +
    (pend ? '<div class="k">' + pend + ' examen(s) en vérification par l’équipe MedCare</div>' : '') + '</div>', null);
  bot('Les tarifs vous engagent : ils ne seront visibles des patients qu’après votre confirmation. Vous confirmez ces tarifs ?', [
    { l: 'Je confirme mes tarifs', a: function () { me('Je confirme mes tarifs'); S.confirmed = true; log('Tarifs confirmés par la structure dans le chat'); toCompte(); } },
    { l: 'Voir le détail', alt: true, a: function () { me('Voir le détail'); detail(); } }
  ]);
}
function detail() {
  var L = finalLines().slice(0, 12);
  var rows = L.map(function (l) { var p = S.prices[l.num] || l.price; var a = S.issues[l.num] === 'reconnu' ? S.m[l.num].cands[0].acte.name : (S.answers[l.num] && S.answers[l.num].acteId ? REFBY[S.answers[l.num].acteId].name : 'en vérification'); return '<li>' + esc(a) + ' · ' + (p.statut === 'sur_devis' ? 'sur devis' : fcfa(p.value)) + '</li>'; }).join('');
  bot('Les premiers examens :<ul>' + rows + '</ul>' + (finalLines().length > 12 ? '<div class="k" style="margin-top:4px;color:var(--ink2)">… et ' + (finalLines().length - 12) + ' autres. La liste complète sera dans votre espace MedCare.</div>' : ''), [
    { l: 'Je confirme mes tarifs', a: function () { me('Je confirme mes tarifs'); S.confirmed = true; log('Tarifs confirmés par la structure dans le chat'); toCompte(); } }
  ]);
}
function toCompte() {
  S.step = 'compte';
  bot('Merci. Dernière étape : <b>activez votre compte</b> pour gérer votre catalogue vous-même ensuite. Vous choisirez juste un mot de passe.', [
    { l: 'Activer mon compte', a: function () { me('Activer mon compte'); S.compte = true; log('Compte réclamé par la structure via le chat'); sys('Compte activé pour ' + S.st.phone); bot('C’est fait, votre compte est actif. L’équipe MedCare vérifie les derniers points, puis votre catalogue part en ligne. Je vous préviens ici dès que c’est le cas.'); S.step = 'fin'; } },
    { l: 'Plus tard', alt: true, a: function () { me('Plus tard'); log('Activation du compte reportée'); bot('Pas de problème. Le lien reste valable 30 jours, et je vous le renverrai au moment de la mise en ligne.'); S.step = 'fin'; } }
  ]);
}

/* ---------- côté MedCare ---------- */
function opsValidate(num) {
  var a = S.answers[num]; if (!a || !a.acteId || a.validated) return;
  a.validated = true;
  var l = S.lines.filter(function (x) { return x.num === Number(num); })[0];
  var key = E.normalize(S.m[l.num].usedText, REFBY[a.acteId].pillar).key;
  S.aliases.push({ brut: S.m[l.num].usedText, key: key, acte: REFBY[a.acteId].name });
  log('Opérateur : réponse validée pour « ' + l.label + ' » · alias ajouté au lexique');
}
function pending() {
  var p = []; S.lines.forEach(function (l) { var a = S.answers[l.num]; if (a && (a.acteId || a.text) && !a.validated) p.push(l); });
  return p;
}
function canPublish() { return S.confirmed && !pending().length && !S.published; }
function publish() {
  S.published = true; S.status = S.compte ? 'actif' : 'publie';
  log('Catalogue publié par MedCare' + (S.compte ? ' · visible des patients' : ' · en attente de l’activation du compte'));
  bot(S.compte ? 'Bonne nouvelle : votre catalogue est <b>en ligne sur MedCare</b>. Les patients peuvent maintenant trouver vos examens et vos tarifs.' : 'Votre catalogue est prêt sur MedCare. Activez votre compte pour le rendre visible des patients.', S.compte ? null : [{ l: 'Activer mon compte', a: function () { me('Activer mon compte'); S.compte = true; S.status = 'actif'; log('Compte réclamé · catalogue visible des patients'); bot('Compte activé, votre catalogue est en ligne.'); } }]);
}

/* ---------- saisie libre ---------- */
function onText(t) {
  t = t.trim(); if (!t) return;
  me(t);
  var low = E.normalize(t, 'bio').full;
  if (S.waiting && S.waiting.kind === 'prix') {
    var p = E.parsePrice(t);
    if (p.statut === 'renseigne' || p.statut === 'sur_devis') { setPrice(S.waiting.q, p); return; }
    bot('Je n’ai pas compris le montant. Écrivez-le en chiffres, par exemple 70000.'); return;
  }
  if (S.waiting && S.waiting.kind === 'precise') { var q = S.waiting.q; S.waiting = null; bot('Merci, je transmets votre précision à l’équipe MedCare.'); answerSens(q, null, t); return; }
  if (/\b(statut|etat|ou en est|avancement)\b/.test(low)) { bot('Votre dossier est à l’étape <b>' + (STEPS.filter(function (s) { return s[0] === S.step; })[0] || ['', 'terminée'])[1].toLowerCase() + '</b>. Statut : ' + STATUS[S.status][0].toLowerCase() + '.'); return; }
  if (/\b(aide|help|comment)\b/.test(low)) { bot('Je peux lire votre fichier de tarifs, vous poser les questions utiles et activer votre compte. Pour parler à une personne, écrivez « conseiller ».'); return; }
  if (/\b(conseiller|humain|appel|appeler)\b/.test(low)) { log('La structure demande un conseiller'); bot('C’est noté, un conseiller MedCare vous rappelle au ' + esc(S.st.phone) + '.'); return; }
  bot('Je note. Utilisez les boutons de réponse ci-dessus, ou écrivez « aide » ou « conseiller ».');
}

/* ---------- rendu ---------- */
function renderSteps() {
  var order = STEPS.map(function (s) { return s[0]; }), i = S.step === 'fin' ? STEPS.length : order.indexOf(S.step);
  document.getElementById('steps').innerHTML = STEPS.map(function (s, k) { return '<div class="st ' + (k < i ? 'done' : k === i ? 'now' : '') + '"><i></i><span>' + s[1] + '</span></div>'; }).join('');
}
function renderMsgs() {
  var box = document.getElementById('msgs');
  var h = S.msgs.map(function (m) {
    if (m.from === 'sys') return '<div class="sys">' + m.html + '</div>';
    return '<div class="m ' + (m.from === 'me' ? 'me' : 'bot') + '">' + m.html + '<span class="t">' + m.at + '</span></div>';
  }).join('');
  if (S.typing) h += '<div class="typing" aria-label="L’assistant écrit"><i></i><i></i><i></i></div>';
  if (S.quick && !S.typing && !queue.length) h += '<div class="quick">' + S.quick.map(function (q, k) { return '<button type="button" class="' + (q.alt ? 'alt' : '') + '" data-q="' + k + '">' + esc(q.l) + '</button>'; }).join('') + '</div>';
  box.innerHTML = h; box.scrollTop = box.scrollHeight;
}
function renderOps() {
  var ok = S.lines.filter(function (l) { return S.issues[l.num] === 'reconnu'; }).length;
  var ans = Object.keys(S.answers).filter(function (k) { return S.answers[k].acteId || S.answers[k].text; }).length;
  var st = STATUS[S.status];
  var h = '<div><h1>Ce que voit MedCare</h1><div class="sub">Le dossier se remplit pendant que la structure répond. L’assistant ne rattache jamais seul un examen : chaque réponse de la structure est validée ici.</div></div>';
  h += '<div class="panel"><h2>Dossier</h2><dl class="kv"><dt>Structure</dt><dd>' + esc(S.st.name) + '</dd><dt>Identifiant</dt><dd class="mono">' + esc(S.st.id) + '</dd><dt>Statut</dt><dd><span class="pill ' + st[1] + '">' + st[0] + '</span></dd>' +
    '<dt>Compte</dt><dd>' + (S.compte ? '<span class="pill p-ok">Réclamé</span>' : '<span class="pill p-cf">Pas encore réclamé</span>') + '</dd><dt>Tarifs</dt><dd>' + (S.confirmed ? '<span class="pill p-ok">Confirmés par la structure</span>' : '<span class="pill p-neutral">Non confirmés</span>') + '</dd><dt>Canal</dt><dd>Chatbot (lien d’onboarding)</dd></dl></div>';
  if (S.lines.length) {
    h += '<div class="sum"><div class="ok"><b>' + ok + '</b><span>reconnus automatiquement</span></div><div class="cf"><b>' + ans + '</b><span>réponses de la structure</span></div><div class="no"><b>' + S.left.length + '</b><span>laissés à MedCare</span></div><div><b>' + Object.keys(S.prices).length + '</b><span>prix confirmés ou saisis</span></div></div>';
    var P = pending();
    h += '<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px"><h2 style="margin:0">Réponses à valider</h2>' + (P.length ? '<button class="btn sm" data-op="all">Tout valider (' + P.filter(function (l) { return S.answers[l.num].acteId; }).length + ')</button>' : '') + '</div>';
    if (!P.length) h += '<div class="empty">' + (ans ? 'Toutes les réponses de la structure sont validées.' : 'Aucune réponse de la structure pour l’instant.') + '</div>';
    else {
      h += '<div class="tw"><table><thead><tr><th>Ligne</th><th>Libellé du fichier</th><th>Réponse de la structure</th><th></th></tr></thead><tbody>';
      P.forEach(function (l) { var a = S.answers[l.num]; h += '<tr><td class="ln">' + l.num + '</td><td>' + esc(l.label) + '</td><td>' + (a.acteId ? esc(REFBY[a.acteId].name) : '<span class="why">précision : « ' + esc(a.text) + ' »</span>') + '</td><td>' + (a.acteId ? '<button class="btn sm" data-op="v" data-n="' + l.num + '">Valider</button>' : '<span class="why">à traiter dans le back-office</span>') + '</td></tr>'; });
      h += '</tbody></table></div>';
    }
    if (S.left.length) h += '<p class="why" style="margin:8px 0 0">' + S.left.length + ' examen(s) laissé(s) par la structure : l’opérateur les traite dans l’écran de rapprochement du back-office.</p>';
    h += '</div>';
    h += '<div class="panel"><h2>Publication</h2>' + (S.published ? '<div class="callout">Lot publié. ' + (S.compte ? 'Catalogue visible des patients.' : 'Visible des patients dès l’activation du compte.') + '</div>' :
      '<p class="why" style="margin:0 0 10px">Possible quand la structure a confirmé ses tarifs et que ses réponses sont validées.</p><button class="btn primary" data-op="pub"' + (canPublish() ? '' : ' disabled') + '>Valider et publier le catalogue</button>') + '</div>';
    if (S.aliases.length) h += '<div class="panel"><h2>Lexique appris dans ce dossier</h2><div class="tw"><table><thead><tr><th>Écriture de la structure</th><th>Acte MedCare</th></tr></thead><tbody>' + S.aliases.map(function (a) { return '<tr><td>' + esc(a.brut.toLowerCase()) + '</td><td>' + esc(a.acte) + '</td></tr>'; }).join('') + '</tbody></table></div><p class="why" style="margin:8px 0 0">Alias propres à la structure + candidats globaux : la prochaine fois, ces examens seront reconnus sans question.</p></div>';
  }
  h += '<div class="panel"><h2>Journal</h2><div class="log">' + S.log.map(function (x) { return '<div><span class="ln">' + x.at + '</span><span>' + esc(x.msg) + '</span></div>'; }).join('') + '</div></div>';
  document.getElementById('ops').innerHTML = h;
}
function render() { renderSteps(); renderMsgs(); renderOps(); }

/* ---------- événements ---------- */
document.getElementById('msgs').addEventListener('click', function (e) {
  var b = e.target.closest('[data-q]'); if (!b || !S.quick) return;
  var q = S.quick[Number(b.dataset.q)]; S.quick = null; q.a();
});
document.getElementById('bar').addEventListener('submit', function (e) { e.preventDefault(); var i = document.getElementById('txt'); var v = i.value; i.value = ''; onText(v); });
document.getElementById('file').addEventListener('change', function (e) {
  var f = e.target.files[0]; e.target.value = ''; if (!f) return;
  me('📎 ' + f.name);
  if (/^image\//.test(f.type)) { log('Photo reçue : ' + f.name + ' · lecture par OCR prévue en V2'); bot('Photo bien reçue. La lecture des photos arrive dans une prochaine version : l’équipe MedCare la saisit pour vous. Si vous avez le fichier Excel, envoyez-le, c’est plus rapide.'); return; }
  if (S.step !== 'fichier' && S.step !== 'lecture') { bot('Je garde ce fichier pour l’équipe MedCare.'); log('Fichier supplémentaire reçu : ' + f.name); return; }
  var rd = new FileReader();
  rd.onload = function () {
    try {
      if (!window.XLSX) throw new Error('lecteur indisponible');
      var wb = XLSX.read(new Uint8Array(rd.result), { type: 'array' }), best = null;
      wb.SheetNames.forEach(function (n) { var r = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: true }); if (!best || r.length > best.length) best = r; });
      S.quick = null; ingest(best.map(function (r) { return (r || []).map(function (v) { return v === undefined ? null : v; }); }), f.name);
    } catch (x) { bot('Je n’arrive pas à ouvrir ce fichier. Pouvez-vous l’envoyer en .xlsx, .ods ou .csv ?'); }
  };
  rd.readAsArrayBuffer(f);
});
document.getElementById('ops').addEventListener('click', function (e) {
  var b = e.target.closest('[data-op]'); if (!b) return;
  if (b.dataset.op === 'v') opsValidate(b.dataset.n);
  else if (b.dataset.op === 'all') pending().forEach(function (l) { opsValidate(l.num); });
  else if (b.dataset.op === 'pub' && canPublish()) publish();
  render();
});
document.getElementById('restart').addEventListener('click', function () { start(S.st.pillar === 'bio' ? 'bio' : 'img'); });
document.querySelectorAll('[data-view]').forEach(function (b) { b.addEventListener('click', function () {
  document.getElementById('shell').dataset.show = b.dataset.view;
  document.querySelectorAll('[data-view]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
}); });

start('img');
})();
</script>
