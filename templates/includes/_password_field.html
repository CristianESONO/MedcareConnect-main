{% comment %}
Champ mot de passe avec bouton afficher / masquer.
Variables : name, id, label, required (bool), placeholder, autocomplete, input_class, label_class, wrap_class
{% endcomment %}
<div class="mc-form-group{% if wrap_class %} {{ wrap_class }}{% endif %}">
  <label class="{% if label_class %}{{ label_class }}{% else %}mc-form-label{% endif %}" for="{{ id }}">{{ label }}</label>
  <div class="mc-password-wrap">
    <input
      type="password"
      name="{{ name }}"
      id="{{ id }}"
      class="{% if input_class %}{{ input_class }}{% else %}mc-form-input{% endif %}"
      {% if required %}required{% endif %}
      {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
      {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
    >
    <button type="button" class="mc-password-toggle" aria-label="Afficher le mot de passe" aria-pressed="false">
      <svg class="mc-password-toggle-icon mc-password-toggle-icon--show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="mc-password-toggle-icon mc-password-toggle-icon--hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
    </button>
  </div>
</div>
