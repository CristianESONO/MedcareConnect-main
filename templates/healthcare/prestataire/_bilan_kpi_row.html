<div class="flex items-start justify-between gap-3 py-3">
  <div class="min-w-0 flex-1">
    <p class="text-[11px] font-medium text-gray-800">{{ k.label }}</p>
    <p class="mt-0.5 text-[10px] text-gray-400">Cible : {{ k.cible }}</p>
    <div class="mt-1.5 h-1 overflow-hidden rounded-full bg-gray-100">
      <div class="h-full rounded-full {% if k.signal == 'ok' %}mc-bg-accent{% elif k.signal == 'warn' %}bg-amber-500{% else %}bg-rose-500{% endif %}" style="width: {{ k.pct }}%"></div>
    </div>
  </div>
  <div class="shrink-0 text-right">
    <p class="text-sm font-extrabold {% if k.signal == 'ok' %}mc-text-accent{% elif k.signal == 'warn' %}text-amber-600{% else %}text-rose-600{% endif %}">{{ k.val }}</p>
    <span class="mt-1 inline-block rounded-full px-1.5 py-0.5 text-[9px] font-bold {% if k.signal == 'ok' %}mc-bg-accent-light mc-text-accent-dark{% elif k.signal == 'warn' %}bg-amber-50 text-amber-700{% else %}bg-rose-50 text-rose-700{% endif %}">
      {% if k.signal == 'ok' %}✓ Cible atteinte{% elif k.signal == 'warn' %}⚠ En cours{% else %}✗ Non atteint{% endif %}
    </span>
  </div>
</div>
